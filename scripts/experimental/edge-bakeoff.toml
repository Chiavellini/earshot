# S2 validation — capture-bakeoff of streamlink vs pipe_tuned vs edge_poll on a
# live reference stream (DW). capture-bakeoff captures + xcorrs the legs (no
# detector), reporting cross-stream delta (vs reference) with a peak. Point
# ~/dw-stream.url at a live DW media playlist first.
[event]
id        = "EDGE-BAKEOFF"
starts_at = "2026-07-24T00:00:00Z"

[pipeline]
chunk_ms       = 160
resample_to_hz = 16000

[detector]
engine = "sherpa_kws"

[detector.sherpa_kws]
model_dir = "models/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01"

[arbiter]
mode = "fanout"

[[sources]]
kind = "pipe"
label = "streamlink"
sample_rate_hz = 16000
cmd = ["/bin/sh","-c","streamlink --stdout --hls-live-edge 1 --hls-segment-stream-data --hls-playlist-reload-time segment \"$(cat $HOME/dw-stream.url)\" best | ffmpeg -loglevel warning -fflags nobuffer -flags low_delay -probesize 65536 -analyzeduration 1000000 -i - -vn -f s16le -ac 1 -ar 16000 -"]

[[sources]]
kind = "pipe"
label = "pipe_tuned"
sample_rate_hz = 16000
cmd = ["/bin/sh","-c","ffmpeg -loglevel warning -fflags nobuffer -flags low_delay -probesize 65536 -analyzeduration 1000000 -live_start_index -1 -http_persistent 1 -reconnect 1 -reconnect_streamed 1 -reconnect_delay_max 2 -i \"$(cat $HOME/dw-stream.url)\" -vn -f s16le -ac 1 -ar 16000 -"]

[[sources]]
kind = "pipe"
label = "edge_poll"
sample_rate_hz = 16000
cmd = ["/bin/sh","-c","python3 scripts/hls-edge-fetch.py \"$(cat $HOME/dw-stream.url)\" 250 2 | ffmpeg -loglevel warning -fflags +discardcorrupt+nobuffer -flags low_delay -probesize 65536 -analyzeduration 1000000 -i - -vn -f s16le -ac 1 -ar 16000 -"]

[kalshi]
series = "KXEARNINGSMENTION"

[[keywords]]
market_ticker    = "KX-BENCH-DUMMY"
phrase           = "guidance"
variants         = ["guidance"]
max_price_cents  = 1
budget_contracts = 1
policy           = "confirmed_only"
