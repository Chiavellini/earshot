schema_version = 2
authority = "canonical-event-operations"
# Declared empty: the manifest key set is exact, and the last historical
# scripts (the 26AUG04 one-day set + the SHOP resolver) were deleted in the
# 2026-08-12 cleanup. Classify any future dated one-off here.
historical_script = []

# This is the small, public operations surface. Every public invocation starts
# at one facade; backing scripts below remain node-owned internal adapters.
[[operator_command]]
name = "surface"
argv = ["scripts/opsctl.sh", "surface"]
arguments = ""
host = "laptop"
purpose = "List the complete supported operator surface."

[[operator_command]]
name = "prepare-day"
argv = ["scripts/opsctl.sh", "prepare-day"]
arguments = "--date YYYY-MM-DD [--dry-run] [--no-mail]"
host = "laptop"
purpose = "Run stage, access binding checks, study, proof-bearing preflight, and typed scheduling for one UTC date."

[[operator_command]]
name = "stage"
argv = ["scripts/opsctl.sh", "stage"]
arguments = "--date YYYY-MM-DD"
host = "laptop"
purpose = "Stage a UTC event date and compile immutable schema-3 RunPlans."

[[operator_command]]
name = "access"
argv = ["scripts/opsctl.sh", "access"]
arguments = "--date YYYY-MM-DD"
host = "laptop"
purpose = "Require a canonical public or pre-established-session AccessPlan for every active webcast RunPlan."

[[operator_command]]
name = "bind-access"
argv = ["scripts/opsctl.sh", "bind-access"]
arguments = "--run-dir PATH --access-mode MODE --resolver-kind KIND [resolver/session options]"
host = "laptop"
purpose = "Bind one immutable webcast RunPlan to an explicit non-secret acquisition prerequisite."

[[operator_command]]
name = "study"
argv = ["scripts/opsctl.sh", "study"]
arguments = "--date YYYY-MM-DD [--dry-run]"
host = "laptop"
purpose = "Measure keyword readiness for every staged lane on a UTC event date."

[[operator_command]]
name = "preflight"
argv = ["scripts/opsctl.sh", "preflight"]
arguments = "--date YYYY-MM-DD [--no-mail]"
host = "laptop"
purpose = "Produce proof-bearing preflight verdicts without launching a run."

[[operator_command]]
name = "schedule"
argv = ["scripts/opsctl.sh", "schedule"]
arguments = "--date YYYY-MM-DD [--dry-run]"
host = "laptop"
purpose = "Install only preflight-passed runs and prove the loaded job readback."

[[operator_command]]
name = "status"
argv = ["scripts/opsctl.sh", "status"]
arguments = "EVENT_ID | YYYY-MM-DD | today"
host = "laptop"
purpose = "Read the typed lifecycle status without changing it."

[[operator_command]]
name = "pull"
argv = ["scripts/opsctl.sh", "pull"]
arguments = "(--date YYYY-MM-DD | --event EVENT_ID) [--dry-run]"
host = "laptop"
purpose = "Retrieve terminal box runs through the verified host boundary."

[[operator_command]]
name = "audit"
argv = ["scripts/opsctl.sh", "audit"]
arguments = "--run-dir var/runs/EVENT_ID/RUN_ID"
host = "laptop"
purpose = "Validate and deterministically grade one retrieved immutable run."

[[operator_command]]
name = "audit-day"
argv = ["scripts/opsctl.sh", "audit-day"]
arguments = "--date YYYY-MM-DD"
host = "laptop"
purpose = "Audit every immutable attempt on a UTC date and publish a derived performance index."

[[operator_command]]
name = "alerts"
argv = ["scripts/opsctl.sh", "alerts"]
arguments = "--run-dir var/runs/EVENT_ID/RUN_ID"
host = "either"
purpose = "List durable delivery and acknowledgement state; return nonzero while any alert is unacknowledged."

[[operator_command]]
name = "ack-alert"
argv = ["scripts/opsctl.sh", "ack-alert"]
arguments = "--run-dir PATH --alert-id 64HEX --by ID [--note text]"
host = "either"
purpose = "Explicitly acknowledge one run-bound alert after a human has seen it."

[[operator_command]]
name = "descope"
argv = ["scripts/opsctl.sh", "descope"]
arguments = "EVENT_TICKER reason [--fallbacks text]"
host = "laptop"
purpose = "Close an intentionally unserved event on the record."

# These may dial, launch, schedule, stop, or prove a run. They are invoked by
# the canonical surface or by a loaded scheduler job, not ad hoc at T-0.
