# Kept at the old path only to give a deterministic refusal and point at the
# replacement. The original implementation remains recoverable in git history.
[[retired_entrypoint]]
path = "scripts/arm-when-url.sh"
replacement = "scripts/opsctl.sh schedule --date YYYY-MM-DD"
reason = "Legacy URL watcher bypassed RunPlan and schedule-proof boundaries."

[[retired_entrypoint]]
path = "scripts/ms-morning.sh"
replacement = "scripts/opsctl.sh prepare-day --date YYYY-MM-DD"
reason = "Issuer/date-specific launcher embedded credentials, numbers, posture, and cleanup."

[[retired_entrypoint]]
path = "scripts/run-arm.sh"
replacement = "scripts/opsctl.sh schedule --date YYYY-MM-DD"
reason = "Slug-based arm path bypassed immutable RunPlan scheduling."

[[retired_entrypoint]]
path = "scripts/wing-autorun.sh"
replacement = "scripts/opsctl.sh prepare-day --date YYYY-MM-DD"
reason = "Issuer-specific resolver and arm were replaced by typed generic acquisition and supervision."

