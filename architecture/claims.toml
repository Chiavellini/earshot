# Every table is an open, collision-protected claim. `complete_pending_commit`
# remains open until its paths are committed or explicitly handed off.

[[claim]]
id = "root.architecture"
node = "project.architecture"
worker = "/root"
branch = "webcast-lane"
state = "active"
contract_change = true
# The registry and this file are edited by every lane that adds a node, an
# owner, or a claim. The claim stays open while that is happening and is
# retired once the governance surface settles.
paths = [
  # 2026-08-04: CLAUDE.md gains the never-point-a-recorder-at-a-tradeable-call
  # convention and the new commands; STATUS.md's `held` count goes 1 -> 3.
  "CLAUDE.md",
  "architecture/claims.toml",
  "architecture/nodes.toml",
  "docs/STATUS.md",
  "docs/nodes/project-architecture.md",
  "docs/work/ACTIVE.md",
]
verification = [
  "python3 scripts/doc-lint.py --self-test",
  "scripts/doc-lint.sh",
]
evidence = ["architecture/nodes.toml"]

[[claim]]
id = "phone.runtime_assembly"
node = "runtime.assembly"
worker = "phone-lane"
branch = "webcast-lane"
state = "active"
contract_change = true
# 2026-08-05 post-mortem, section 1: `arm()` writes report.json only on a clean
# pipeline drain (src/main.rs:1334). Of ~14 exit paths exactly one produced a
# report — MELI ended on the pipe idle guard (src/source/pipe.rs:184) and its
# entire record was lost. The tail of arm() becomes a single finish_run() choke
# point called from BOTH the Ok and Err arms, and PipelineReport gains an
# `exit` record so a run always says how it ended.
paths = [
  "docs/nodes/runtime-assembly.md",
  "src/lib.rs",
  "src/main.rs",
  "tests/report_on_exit.rs",
  # Section 2: these two asserted `send_ts.is_some()` inline; they now call the
  # canonical OrderRecord::reached_wire() so the predicate has ONE definition.
  "tests/e2e_full_chain.rs",
  "tests/perf_budget.rs",
  # 2026-08-07: both composers read Detector::engine_name() before the detector
  # moves into its thread and stamp it on PipelineReport. Fanout reports the
  # DISTINCT set joined by "+" rather than asserting one engine, since nothing
  # forces a config's legs to agree.
  "src/pipeline/mod.rs",
]
verification = [
  "cargo test --test e2e_full_chain",
  "cargo test --test twilio_listen_only",
  "cargo test --test report_on_exit",
  "cargo test --test kill_sigterm",
]
evidence = ["docs/nodes/runtime-assembly.md"]

[[claim]]
id = "post26aug05.wire_truth"
node = "runtime.kalshi.executor"
worker = "phone-lane"
branch = "webcast-lane"
state = "active"
contract_change = true
# 2026-08-05, section 2. `ExecReport.orders` is a list of INTENTS — all five
# non-fire early returns push a record — so `orders.len()` reported "23 orders
# placed" for a morning that sent nothing, and the `[LIVE]` tag came from
# `!dry_run` rather than from any wire event. Adds the canonical predicates
# `OrderRecord::reached_wire()` / `acked()`, replacing four drifting copies of
# `send_ts.is_some()` in the test suite.
paths = [
  "docs/layers/executor.md",
  "src/kalshi/executor.rs",
  "tests/exec_mock.rs",
  "tests/exec_fix_mock.rs",
]
verification = [
  "cargo test --lib executor",
  "cargo test --test exec_mock",
  "cargo test --test exec_fix_mock",
]
evidence = ["docs/layers/executor.md"]

[[claim]]
id = "post26aug05.telemetry_exit_record"
node = "runtime.telemetry"
worker = "phone-lane"
branch = "webcast-lane"
state = "active"
contract_change = true
# Companion to phone.runtime_assembly: PipelineReport gains
# `exit: ExitRecord { reason, detail }` so every terminated run is queryable
# the same way whether it drained cleanly, died on a source error, or was
# SIGTERMed. Without it a missing report and a crashed run are indistinguishable
# from a run that never armed.
paths = [
  "docs/layers/telemetry.md",
  "src/telemetry.rs",
]
verification = [
  "cargo test --lib telemetry",
  "cargo test --test report_on_exit",
]
evidence = ["docs/layers/telemetry.md"]

