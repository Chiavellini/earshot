# ── read-quantum-lane: PARKED MID-EDIT, 2026-07-30 17:10, power loss ─────────
# `scripts/prefetch-gate.sh` is the 90-minute drop-safety gate that
# docs/LATENCY-PROOF.md §Q1 names as its own blocking open item. It was being
# retrofitted to run against a local low-bitrate fixture when the session died.
# Do not run it and trust the result until these four are fixed:
#   1. the GATE START banner still prints a hardcoded `master=IVS demo`, so a
#      run against a custom $3/$EARSHOT_GATE_MASTER mislabels its own log;
#   2. `cd "$HOME/ear"` is the box path — on this laptop (~/Code/ear) it exits 1;
#   3. the sampler uses GNU `stat -c %s`; on macOS that fails, `|| echo 0` makes
#      the `-gt 1000` guard never pass, and prefetch-verdict.py then returns
#      INCONCLUSIVE — a silent null on the very gate the edit exists to enable;
#   4. the ~71 kbps rolling fixture the new comment depends on was built ad hoc
#      and never committed; no generator script exists in the repo.
# Until the gate runs and passes, `--chunk-ms` correctly still defaults to 0.
# `configs/pcm-lead-chunkms.toml` (claimed under control.prepare) is the
# pre-registered A/B for the same question and has never been run.

