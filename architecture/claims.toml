[[claim]]
id = "phone.runtime_assembly"
node = "runtime.assembly"
worker = "execution-identity-lane"
branch = "webcast-lane"
state = "complete_pending_commit"
contract_change = true
# 2026-08-05 post-mortem, section 1: `arm()` writes report.json only on a clean
# pipeline drain (src/main.rs:1334). Of ~14 exit paths exactly one produced a
# report — MELI ended on the pipe idle guard (src/source/pipe.rs:184) and its
# entire record was lost. The tail of arm() becomes a single finish_run() choke
# point called from BOTH the Ok and Err arms, and PipelineReport gains an
# `exit` record so a run always says how it ended.
# 2026-08-11 handoff: the claimed paths are clean. Runtime-reliability-lane
# takes the completed historical claim to wire live arms to the event-scoped
# persistent DecisionTable. Dry runs/replays remain in-memory and cannot
# consume live one-shot state.
# 2026-08-11 reliability continuation: runtime-reliability-lane completed and
# verified mandatory RunPlan evidence/finalization.  The same open node claim
# is now handed to execution-identity-lane for the bounded read-only
# `account-fingerprint` CLI adapter; no further assembly lifecycle work is in
# scope for that lane.
paths = [
  "docs/nodes/runtime-assembly.md",
  "src/lib.rs",
  "src/main.rs",
  "tests/report_on_exit.rs",
  # Section 2: these two asserted `send_ts.is_some()` inline; they now call the
  # canonical OrderRecord::reached_wire() so the predicate has ONE definition.
  "tests/e2e_full_chain.rs",
  "tests/perf_budget.rs",
  "tests/e2e_fanout.rs",
  "tests/e2e_replay.rs",
  # 2026-08-07: both composers read Detector::engine_name() before the detector
  # moves into its thread and stamp it on PipelineReport. Fanout reports the
  # DISTINCT set joined by "+" rather than asserting one engine, since nothing
  # forces a config's legs to agree.
  "src/pipeline/mod.rs",
]
verification = [
  "cargo test --lib decision",
  "cargo test --test e2e_full_chain",
  "cargo test --test twilio_listen_only",
  "cargo test --test report_on_exit",
  "cargo test --test kill_sigterm",
]
evidence = ["docs/nodes/runtime-assembly.md"]

