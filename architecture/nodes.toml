[[node]]
id = "runtime.telemetry"
job = "Record cross-stage latency, counters, source health, and execution outcomes into one session report."
status = "active"
doc = "docs/layers/telemetry.md"
doc_style = "layer"
owns = ["src/telemetry.rs"]
inputs = [
  "runtime.core",
  "runtime.pipeline.lifecycle",
  "runtime.detections",
  "runtime.execution.intents",
  "runtime.market.books",
  "runtime.execution.records",
  "runtime.order.evidence",
  "control.phone.attached",
]
outputs = ["runtime.telemetry.report"]

[[node]]
id = "control.discover"
job = "Discover the upcoming event slate and make changes or discovery failures visible."
status = "active"
doc = "docs/nodes/control-discover.md"
doc_style = "node"
owns = [
  "slate/latest.json",
  "slate/census.json",
  "slate/changes/**",
  "scripts/discover-events.py",
  "scripts/mentions-census.py",
  "scripts/slate-daily.sh",
  "scripts/slate-diff.py",
  "scripts/slate-intraday.sh",
]
inputs = ["platform.notification"]
outputs = ["control.events.discovered"]

[[node]]
id = "control.qualify"
job = "Enrich discovered events with read-only market, venue, and access facts required by preparation and admission."
status = "active"
doc = "docs/nodes/control-qualify.md"
doc_style = "node"
owns = [
  # "does this issuer have an OPEN mention board right now" — one public,
  # unauthenticated GET. Read-only market fact, which is this node's job.
  # Two consumers: evidence.capture's refuse-to-record guard and
  # control.grade's missed-arm reconciliation.
  "scripts/board-open.py",
  "configs/dial-ins.toml",
  "docs/DIAL-INS.md",
  "scripts/mine-dial-in.py",
  "scripts/recon-worklist.py",
  # hunt verdicts -> paste-ready registry rows. Proposes only; the registry
  # stays human-audited because admission is probe-only (THE MSFT RULE).
  "scripts/registry-propose.py",
  "scripts/fetch-say-qa.sh",
  "docs/SAY-QA-PRIOR.md",
  "slate/worklist.md",
]
inputs = ["control.events.discovered", "control.bridge.candidates"]
outputs = ["control.event.qualified"]

[[node]]
id = "control.prepare"
job = "Generate a reviewable event configuration and keyword policy without arming the runtime."
status = "active"
doc = "docs/layers/prepare.md"
doc_style = "layer"
owns = [
  # webcast twin -> phone-only arm + its autorun env (keywords_sha256 preserved)
  "scripts/phone-lane-derive.py",
  "configs/[!d]*.toml",
  # the [!d] above exists ONLY to exclude dial-ins.toml (control.qualify's
  # registry). It also excludes any d-named config: while d-issuer event
  # configs existed (dash, dis, dkng, duol, 2026-08-04) two re-admit globs
  # (`configs/d[!i]*.toml` + `configs/di[!a]*.toml`) covered them; the
  # 2026-08-12 per-event cleanup removed the last d-configs and doc-lint
  # fails a glob matching zero files, so re-add those globs with the next
  # d-issuer event.
  "src/prepare.rs",
  "scripts/stage-webcast-arm.sh",
  "scripts/stage-webcast-capture.sh",
  "scripts/slate-stage.sh",
  "scripts/stage-reconcile.py",
  "tests/stage_reconcile.py",
  # staging input shaping: hand-verified call times merged into the slate the
  # stager consumes (slate/latest-timed.json is generated → gitignored).
  "scripts/slate-time-merge.py",
  "slate/call-times.json",
]
inputs = [
  "runtime.core",
  "control.event.qualified",
  "runtime.detector.keyword_compiler",
]
outputs = ["control.event.prepared"]

[[node]]
id = "control.operate"
job = "Give the operator one place to run an event day from and one place to reconstruct it: day runbooks, the per-event lifecycle journal, the green gate, and the T-0 agent installers."
status = "active"
doc = "docs/nodes/control-operate.md"
doc_style = "node"
owns = [
  "HANDOFF-EVENT-LIFECYCLE.md",
  "docs/runbooks/**",
  "scripts/journal.sh",
  "scripts/assert-ready.sh",
  "scripts/descope-event.sh",
  "scripts/watcher-liveness.sh",
  "scripts/install-t0-agents.sh",
  "scripts/study-nightly.sh",
  "scripts/stage-nightly.sh",
  "scripts/event-status.sh",
  "scripts/green-guardian.sh",
  "scripts/night-before-sweep.sh",
  # 2026-08-11: the typed run control plane — immutable run plan + append-only
  # hash-chained receipts under var/runs/<EVENT_ID>/<RUN_ID>/. Orchestrates
  # existing entry points; deliberately NOT a third runtime composer.
  "scripts/eventctl.py",
  "scripts/run-host-boundary.py",
  "scripts/schedule-nightly.sh",
  # One-time, external-account-profile bootstrap: derives the stable public
  # signer fingerprint through the pinned binary and atomically maintains only
  # non-secret host/account identity fields in the already external account
  # env.  Event configs never carry this host-specific identity.
  "scripts/execution-profile.sh",
  "scripts/opsctl.sh",
  "tests/eventctl_lifecycle.py",
  "tests/execution_profile.sh",
  "tests/run_host_boundary.py",
  "tests/opsctl.py",
]
inputs = []
outputs = ["control.run.plan", "control.run.receipts"]

[[node]]
id = "control.preflight"
job = "Refuse an event before launch when configuration, credentials, binaries, allowlists, or keyword readiness are incomplete."
status = "active"
doc = "docs/nodes/control-preflight.md"
doc_style = "node"
owns = [
  "docs/RACE-CHECKLIST.md",
  "scripts/allowlist-diff.sh",
  "scripts/collision-screen.py",
  "scripts/market-phrase-screen.py",
  "scripts/preflight-event.sh",
  "scripts/preflight-proof.py",
  "scripts/preflight-nightly.sh",
  "scripts/posture-from-study.py",
  "tests/preflight_proof.py",
]
inputs = [
  "control.event.prepared",
  "control.event.admitted",
  "control.endpoint.resolved",
  "runtime.market.plan",
  "platform.deploy.artifact",
  "platform.runtime.profile",
  "platform.notification",
]
outputs = ["control.event.preflighted"]

[[node]]
id = "control.hunt"
job = "Search SEC primary sources for an issuer's earnings-call dial-in bridge and publish evidence-backed number candidates for admission to probe."
status = "active"
doc = "docs/nodes/control-hunt.md"
doc_style = "node"
owns = [
  "scripts/hunt-dial-in.py",
  "scripts/hunt-daily.sh",
  # Reads the governing VERB of a published credential and refuses to emit a
  # DTMF suffix for one that is spoken to a human ("referencing Meeting ID").
  # Owned here, not by control.admission: it parses published source text into
  # a number candidate (control.bridge.numbers), which is this node's job. It
  # emits an admission PRIOR only — never a verdict — so THE MSFT RULE stands
  # and no admission->hunt->admission cycle is created.
  "scripts/dial-in-intake.py",
  "docs/HUNT.md",
  "slate/hunt-status.json",
]
inputs = [
  "control.events.discovered",
  "platform.notification",
]
outputs = ["control.bridge.candidates", "control.bridge.numbers"]

[[node]]
id = "control.admission"
job = "Probe conference-bridge admission behavior and produce an explicit listen-access verdict."
status = "active"
doc = "docs/nodes/control-admission.md"
doc_style = "node"
owns = [
  # the reservation-window venue class: probeable only at T-90..T-30
  "scripts/admission-window-probe.sh",
  "scripts/bridge-probe-batch.sh",
  "scripts/bridge-probe.sh",
  # Writes this node's own verdict into control.qualify's registry
  # (configs/dial-ins.toml) and the proven digits into control.bridge.numbers.
  # Owned HERE, not by control.qualify, on purpose: qualify already feeds
  # admission (control.event.qualified), so having qualify own the consumer of
  # control.event.admitted would close a qualify->admission->qualify dependency
  # cycle, which doc-lint rejects. Writing another node's artifact is a data
  # flow, not co-ownership. THE MSFT RULE is unchanged — admission is still set
  # only by a probe dial; this just stops the answer dying on a terminal, which
  # is how SPOT's proven bridge went unregistered on 2026-08-04.
  "scripts/registry-admit.py",
  # Converts a still-fresh, probe-established `admission = "held"` verdict
  # into a current-run/current-stream admission receipt.  It does not probe,
  # dial, page, or infer operator passage: the immutable RunPlan, lifecycle
  # chain, live challenge, detector-path attachment, and Twilio CallSid/attempt
  # must all agree before the runtime interlock can open.
  "scripts/held-admission-receipt.py",
  "tests/held_admission_receipt.py",
]
inputs = [
  "control.event.qualified",
  "control.bridge.candidates",
  "control.bridge.numbers",
]
outputs = ["control.event.admitted"]

