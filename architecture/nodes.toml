schema_version = 1

[lint]
node_required_headings = [
  "Job",
  "Owns",
  "Does not own",
  "Input contracts",
  "Output contracts",
  "Side effects and exclusive resources",
  "Failure contract",
  "Parallel work boundary",
  "Verification",
  "Migration status",
]
layer_required_headings = [
  "Role",
  "Entry door",
  "Exit door",
  "Obligations",
  "Failure policy",
  "How to replace or edit",
  "How to test",
]
citation_globs = [
  "*.md",
  "docs/**/*.md",
  "src/**/*.rs",
  "tests/**/*.rs",
  "scripts/**/*.py",
  "scripts/**/*.sh",
]

[lint.ownership]
# The collaboration universe is derived from Git's tracked + non-ignored
# untracked candidates. These globs say which first-party classes must have
# exactly one node owner. Local/generated/vendor surfaces stay outside it.
govern_root_files = true
governed_globs = [
  "architecture/**",
  "benches/**",
  "configs/**",
  "corpus/manifests/**",
  "corpus/structure/**",
  "corpus/bridge-probes/**",
  "deploy/**",
  "docs/**",
  "examples/**",
  "scripts/**",
  "slate/**",
  "src/**",
  "state/**",
  "tests/**",
  "**/Cargo.toml",
]
excluded_globs = [
  ".git/**",
  ".agents/**",
  ".codex/**",
  # Agent-harness surface, not runtime: skills are procedures for an assistant,
  # and the procedure they encode lives in the nodes they call, not in a node of
  # their own. Excluded explicitly rather than by accident of glob coverage.
  ".claude/**",
  ".venv*/**",
  "target/**",
  "vendor/**",
  "models/**",
  "credentials/**",
  "secrets/**",
  "state/**",
  "corpus/raw/**",
  "corpus/telephony/**",
  "corpus/transcripts/**",
  "corpus-t*/**",
  "corpus-quiet/**",
  # keyword-readiness artifacts written by scripts/variant-study.sh and read
  # by preflight's readiness gate — generated per study run, never claimed.
  "configs/.readiness/**",
  # short-token acknowledgements written per config by preflight-event.sh:366.
  # Same class as .readiness: a per-event operator decision record, generated
  # not authored, so it has no owning node and is never claimed.
  "configs/.acks/**",
  "scripts/__pycache__/**",
  # nested bytecode caches too (e.g. scripts/fake-operator/__pycache__/)
  "scripts/**/__pycache__/**",
  "**/.DS_Store",
  "**/*.wav",
  "**/*.pem",
  "**/*.key",
  ".env",
  ".env.*",
  "**/.env",
  "**/.env.*",
  "**/report.json",
]
# These three checked-in reports are durable evidence, not local run state.
reincluded_paths = [
  "state/KXEARNINGSMENTIONAAL-26JUL23/box/capture-report.json",
  "state/KXEARNINGSMENTIONINTC-26JUL23/report-box.json",
  "state/KXEARNINGSMENTIONLMT-26JUL23/box/capture-report.json",
]

# `owns` is exclusive implementation ownership, not a dependency list. A node
# may call another node's files, but must not add those files to its own list.

[[node]]
id = "project.architecture"
job = "Define the project node map, contract vocabulary, documentation template, and automated documentation checks."
status = "active"
doc = "docs/nodes/project-architecture.md"
doc_style = "node"
owns = [
  "AGENTS.md",
  "CLAUDE.md",
  "README.md",
  "architecture/claims.toml",
  "architecture/nodes.toml",
  "architecture/operations.toml",
  "docs/ARCHITECTURE.md",
  "docs/NODES.md",
  "docs/ROADMAP.md",
  "docs/SPEC.md",
  "docs/STATUS.md",
  "docs/SYSTEM-STATE.md",
  "docs/nodes/TEMPLATE.md",
  "docs/work/ACTIVE.md",
  "docs/work/SOLUTION-CAPTURE.md",
  "docs/work/SOLUTION-EVIDENCE.md",
  "docs/work/SOLUTION-OBSERVABILITY.md",
  "scripts/doc-lint.py",
  "scripts/doc-lint.sh",
  "scripts/ops-surface-check.py",
  "tests/ops_surface.py",
  "tests/architecture_contract.rs",
]
inputs = []
outputs = ["project.node_registry"]

[[node]]
id = "project.build"
job = "Define the Rust workspace, dependency resolution, feature surface, and repository build exclusions."
