doc_style = "node"
owns = [
  "corpus/bridge-probes/*.json",
  "corpus/bridge-probes/*.jsonl",
  # *.txt (ASR of the bridge) and *.wav are gitignored: an operator reads the
  # dial-in aloud, so the transcript carries live digits. Local evidence only.
  "state/KXEARNINGSMENTIONAAL-26JUL23/box/capture-report.json",
  "state/KXEARNINGSMENTIONINTC-26JUL23/report-box.json",
  "state/KXEARNINGSMENTIONLMT-26JUL23/box/capture-report.json",
  "src/capture_bakeoff/*.rs",
  # Chained multi-leg bridge recorder. Owned HERE and not by control.admission
  # (which owns bridge-probe.sh) because it banks corpus, never classifies
  # admission. It was unowned until 2026-08-04, when it recorded two live
  # earnings calls that should have been armed — the fault could not be
  # localized to a node precisely because the runtime path had no node.
  # Its refuse-to-record guard enforces this node's own contract line:
  # evidence.capture does not launch a traded arm.
  "scripts/chain-capture.sh",
  "scripts/fetch-tape.sh",
  "scripts/pdt-log.py",
  "scripts/wnt-captions-parse.py",
  "scripts/wnt-daily.sh",
  "scripts/wnt-vod-fetch.sh",
]
