schema_version = 1

[lint]
node_required_headings = [
  "Job",
  "Owns",
  "Does not own",
  "Input contracts",
  "Output contracts",
  "Side effects and exclusive resources",
  "Failure contract",
  "Parallel work boundary",
  "Verification",
  "Migration status",
]
layer_required_headings = [
  "Role",
  "Entry door",
  "Exit door",
  "Obligations",
  "Failure policy",
  "How to replace or edit",
  "How to test",
]
citation_globs = [
  "*.md",
  "docs/**/*.md",
  "src/**/*.rs",
  "tests/**/*.rs",
  "scripts/**/*.py",
  "scripts/**/*.sh",
]

[lint.ownership]
# The collaboration universe is derived from Git's tracked + non-ignored
# untracked candidates. These globs say which first-party classes must have
# exactly one node owner. Local/generated/vendor surfaces stay outside it.
govern_root_files = true
governed_globs = [
  "architecture/**",
  "benches/**",
  "configs/**",
  "corpus/manifests/**",
  "corpus/structure/**",
  "corpus/bridge-probes/**",
  "deploy/**",
  "docs/**",
  "examples/**",
  "scripts/**",
  "slate/**",
  "src/**",
  "state/**",
  "tests/**",
  "**/Cargo.toml",
]
excluded_globs = [
  ".git/**",
  ".agents/**",
  ".codex/**",
  ".claude/scheduled_tasks.lock",
  ".venv*/**",
  "target/**",
  "vendor/**",
  "models/**",
  "credentials/**",
  "secrets/**",
  "state/**",
  "corpus/raw/**",
  "corpus/telephony/**",
  "corpus/transcripts/**",
  "corpus-t*/**",
  "corpus-quiet/**",
  # keyword-readiness artifacts written by scripts/variant-study.sh and read
  # by preflight's readiness gate — generated per study run, never claimed.
  "configs/.readiness/**",
  # short-token acknowledgements written per config by preflight-event.sh:366.
  # Same class as .readiness: a per-event operator decision record, generated
  # not authored, so it has no owning node and is never claimed.
  "configs/.acks/**",
  "scripts/__pycache__/**",
  # nested bytecode caches too (e.g. scripts/fake-operator/__pycache__/)
  "scripts/**/__pycache__/**",
  "**/.DS_Store",
  "**/*.wav",
  "**/*.pem",
  "**/*.key",
  ".env",
  ".env.*",
  "**/.env",
  "**/.env.*",
  "**/report.json",
]
# These three checked-in reports are durable evidence, not local run state.
reincluded_paths = [
  "state/KXEARNINGSMENTIONAAL-26JUL23/box/capture-report.json",
  "state/KXEARNINGSMENTIONINTC-26JUL23/report-box.json",
  "state/KXEARNINGSMENTIONLMT-26JUL23/box/capture-report.json",
]

# `owns` is exclusive implementation ownership, not a dependency list. A node
# may call another node's files, but must not add those files to its own list.

[[node]]
id = "project.architecture"
job = "Define the project node map, contract vocabulary, documentation template, and automated documentation checks."
status = "active"
doc = "docs/nodes/project-architecture.md"
doc_style = "node"
owns = [
  "AGENTS.md",
  "CLAUDE.md",
  "README.md",
  "architecture/claims.toml",
  "architecture/nodes.toml",
  "docs/ARCHITECTURE.md",
  "docs/NODES.md",
  "docs/ROADMAP.md",
  "docs/SPEC.md",
  "docs/STATUS.md",
  "docs/nodes/TEMPLATE.md",
  "docs/work/ACTIVE.md",
  "scripts/doc-lint.py",
  "scripts/doc-lint.sh",
  "tests/architecture_contract.rs",
]
inputs = []
outputs = ["project.node_registry"]

[[node]]
id = "project.build"
job = "Define the Rust workspace, dependency resolution, feature surface, and repository build exclusions."
status = "active"
doc = "docs/nodes/project-build.md"
doc_style = "node"
owns = [
  ".gitignore",
  "Cargo.lock",
  "Cargo.toml",
]
inputs = []
outputs = ["project.build.workspace"]

[[node]]
id = "runtime.foundation"
job = "Provide the shared clock, immutable data types, bounded rings, and atomic filesystem writes."
status = "active"
doc = "docs/nodes/runtime-foundation.md"
doc_style = "node"
owns = [
  "src/clock.rs",
  "src/fsio.rs",
  "src/ring.rs",
  "src/types.rs",
]
inputs = []
outputs = ["runtime.core"]

[[node]]
id = "runtime.assembly"
job = "Wire configured runtime nodes into one process and own lifecycle startup and shutdown."
status = "active"
doc = "docs/nodes/runtime-assembly.md"
doc_style = "node"
owns = [
  "src/lib.rs",
  "src/main.rs",
  "src/pipeline/mod.rs",
  "tests/e2e_fanout.rs",
  "tests/e2e_full_chain.rs",
  "tests/e2e_replay.rs",
  "tests/perf_budget.rs",
]
inputs = [
  "project.build.workspace",
  "runtime.core",
  "runtime.config.loaded",
  "runtime.market.plan",
  "runtime.source.interface",
  "runtime.source.replay.frames",
  "runtime.source.twilio.frames",
  "runtime.source.sip.frames",
  "runtime.source.pipe.frames",
  "runtime.source.arbiter.frames",
  "platform.runtime.profile",
]
outputs = [
  "runtime.audio.frames",
  "runtime.pipeline.lifecycle",
  "runtime.source.twilio.listener_ready",
]

[[node]]
id = "runtime.config"
job = "Parse and locally validate one event configuration into the typed runtime configuration."
status = "active"
doc = "docs/layers/config.md"
doc_style = "layer"
owns = [
  "src/config.rs",
]
inputs = [
  "runtime.core",
  "control.event.prepared",
]
outputs = ["runtime.config.loaded"]

[[node]]
id = "runtime.source.port"
job = "Define the origin-neutral AudioSource boundary implemented by every media adapter."
status = "active"
doc = "docs/nodes/source-port.md"
doc_style = "node"
owns = [
  "docs/layers/source.md",
  "src/source/mod.rs",
]
inputs = ["runtime.core"]
outputs = ["runtime.source.interface"]

[[node]]
id = "runtime.source.replay"
job = "Convert paced or unpaced WAV replay input into timestamped audio frames."
status = "active"
doc = "docs/nodes/source-replay.md"
doc_style = "node"
owns = ["src/source/replay.rs"]
inputs = [
  "runtime.core",
  "runtime.source.interface",
]
outputs = ["runtime.source.replay.frames"]

[[node]]
id = "runtime.source.twilio"
job = "Accept Twilio Media Streams WebSocket audio and emit timestamped audio frames."
status = "active"
doc = "docs/nodes/source-twilio.md"
doc_style = "node"
owns = [
  "docs/TWILIO.md",
  "src/source/twilio_ws.rs",
  "tests/twilio_source.rs",
]
inputs = [
  "runtime.core",
  "runtime.source.interface",
]
outputs = ["runtime.source.twilio.frames", "runtime.source.twilio.stream_connected"]

[[node]]
id = "runtime.source.sip"
job = "Receive a SIP media session and emit decoded timestamped audio frames."
status = "active"
doc = "docs/nodes/source-sip.md"
doc_style = "node"
owns = [
  "src/source/sip.rs",
  "tests/sip_source.rs",
]
inputs = [
  "runtime.core",
  "runtime.source.interface",
  "control.endpoint.resolved",
]
outputs = ["runtime.source.sip.frames"]

[[node]]
id = "runtime.source.pipe"
job = "Supervise an external decoder command and convert its PCM stream into timestamped audio frames."
status = "active"
doc = "docs/nodes/source-pipe.md"
doc_style = "node"
owns = [
  "src/source/pipe.rs",
  "scripts/hls-edge-fetch.py",
  "scripts/test-deaf-leg.py",
  "tests/pipe_source.rs",
]
inputs = [
  "runtime.core",
  "runtime.source.interface",
  "control.endpoint.resolved",
]
outputs = ["runtime.source.pipe.frames"]

[[node]]
id = "runtime.source.arbiter"
job = "Align and select among multiple source legs before presenting one origin-neutral frame stream."
status = "active"
doc = "docs/nodes/source-arbiter.md"
doc_style = "node"
owns = [
  "src/source/arbiter.rs",
  "src/xcorr.rs",
  "tests/arbiter.rs",
]
inputs = [
  "runtime.core",
  "runtime.source.interface",
  "runtime.source.replay.frames",
  "runtime.source.twilio.frames",
  "runtime.source.sip.frames",
  "runtime.source.pipe.frames",
]
outputs = ["runtime.source.arbiter.frames"]

[[node]]
id = "runtime.preproc"
job = "Apply frame-local signal preprocessing and stamp the preprocessing boundary without changing ownership of source timing."
status = "active"
doc = "docs/layers/preproc.md"
doc_style = "layer"
owns = ["src/pipeline/preproc.rs"]
inputs = [
  "runtime.core",
  "runtime.audio.frames",
]
outputs = ["runtime.audio.preprocessed"]

[[node]]
id = "runtime.chunker"
job = "Accumulate preprocessed frames into detector-sized audio chunks."
status = "active"
doc = "docs/layers/chunker.md"
doc_style = "layer"
owns = ["src/pipeline/chunker.rs"]
inputs = [
  "runtime.core",
  "runtime.audio.preprocessed",
]
outputs = ["runtime.audio.chunks"]

[[node]]
id = "runtime.detector.port"
job = "Select a configured detector capability behind the origin-neutral Detector port and turn audio chunks into detections."
status = "active"
doc = "docs/layers/detector.md"
doc_style = "layer"
owns = [
  "docs/TELEPHONY-DETECTION-SPEC.md",
  "src/detector/factory.rs",
  "src/detector/mod.rs",
  "src/detector/stub.rs",
]
inputs = [
  "runtime.core",
  "runtime.audio.chunks",
  "runtime.config.loaded",
  "runtime.detector.keyword_compiler",
  "runtime.detector.sherpa_engine",
  "runtime.detector.streaming_ctc_engine",
]
outputs = ["runtime.detections"]

[[node]]
id = "runtime.detector.keyword_compile"
job = "Compile BPE tokens, keyword phrases, and prefix-safety metadata into detector-ready keyword inputs."
status = "active"
doc = "docs/nodes/detector-keyword-compile.md"
doc_style = "node"
owns = [
  "docs/PREFIX-SAFETY.md",
  "src/detector/kws_compile.rs",
]
inputs = ["runtime.core"]
outputs = ["runtime.detector.keyword_compiler"]

[[node]]
id = "runtime.detector.sherpa"
job = "Construct and verify the Sherpa-ONNX keyword-spotting detector engine."
status = "active"
doc = "docs/nodes/detector-sherpa.md"
