[[node]]
id = "runtime.order_transport"
job = "Normalize REST and FIX staging, send, and acknowledgement behavior behind one order-wire seam."
status = "active"
doc = "docs/nodes/runtime-order-transport.md"
doc_style = "node"
owns = [
  "src/kalshi/mod.rs",
  "src/kalshi/rest.rs",
  "src/kalshi/transport.rs",
]
inputs = [
  "runtime.core",
  "runtime.auth.headers",
