status = "active"
doc = "docs/nodes/control-grade.md"
doc_style = "node"
owns = [
  # "we captured a call whose board traded, and placed nothing." The detector
  # for the 2026-08-04 class, deliberately independent of WHICH upstream node
  # broke — it reads only the evidence on disk, so it fires whether discover
  # lost the event, qualify lost the bridge, or the wrong tool was pointed at
  # the call. An execution verdict on a run that never happened is still an
  # execution verdict, which is why it lives here.
  "scripts/missed-arm-check.py",
  # Brings a BOX-HOSTED run's artifacts to where every grader here reads.
  # deploy-box.sh excludes state/ in both directions, so a box run left nothing
  # on the laptop and was invisible to this node entirely — HIMS 26AUG10's
  # phone lane traded 2 orders and graded as "0 orders" for exactly that reason.
  # Owned here, not by control.supervise: supervision runs the event, grading is
  # what needs the evidence local, and the puller is read-only on the box.
  "scripts/pull-box-state.sh",
  "scripts/run-audit.py",
  # Reconciles every immutable attempt on one UTC date, continues across
  # siblings, and publishes a derived performance index bound to exact grade
  # and lifecycle-tail fingerprints.
  "scripts/audit-day.py",
  # the checker writes nothing and alerts nothing by design; the wrapper owns
  # the daily firing's notify path (PYPL/BA lesson: a check nobody hears is
  # not a check). Its launchd plist lives with the others under
  # platform.runtime's configs/launchd/**.
  "scripts/missed-arm-daily.sh",
  "scripts/run-verdict.sh",
  "scripts/validate-from-log.py",
  "scripts/post-event-report.sh",
  "scripts/score-precision.py",
  "tests/run_audit.py",
  "tests/audit_day.py",
  "tests/score_precision.py",
]
