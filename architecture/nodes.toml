[[node]]
id = "runtime.detector.streaming_ctc"
job = "Construct the streaming CTC detector engine and own its start-anytime Viterbi scorer."
status = "active"
doc = "docs/nodes/detector-streaming-ctc.md"
doc_style = "node"
owns = [
  "docs/CTC-MODEL-SOURCING.md",
  "scripts/export-english-streaming-ctc.md",
  "src/detector/ctc_scorer.rs",
  "src/detector/streaming_ctc.rs",
]
inputs = [
  "runtime.core",
  "runtime.detector.keyword_compiler",
]
outputs = ["runtime.detector.streaming_ctc_engine"]

[[node]]
id = "runtime.decision"
job = "Apply one-shot keyword policy to detections and emit bounded execution intents."
status = "active"
doc = "docs/layers/decision.md"
doc_style = "layer"
owns = ["src/decision.rs"]
inputs = [
  "runtime.core",
  "runtime.detections",
]
