# ── TBPN (@TBPNLive) — live-streaming acquisition capture kit (NOT armed) ──
# Modeled on configs/webcast-abcwnt-capture.toml's proven capture-only shape,
# and on pm-expansion-exploration/latency/mlb/configs/knbr-giants-capture.toml's
# 2-leg fetch-tuning structure. Lives entirely under
# pm-expansion-exploration/latency/tbpn/ — never registered in configs/,
# never referenced by any production script.
#
# WHY THIS EXISTS: pack-lag testing on KXTBPNMENTION-26JUL23 found this
# market's existing "pack" does NOT react to individual mentions live — all
# 4 measured strikes repriced within the same ~9-minute window near the
# show's end regardless of when in the ~110-minute episode each word was
# actually said (see pm-expansion-exploration/latency/tbpn/pack_lag_tbpn.py
# and ../latency-scoreboard.md). That looks like an ABSENT real-time
# competitor, not a slow one — unlike MLB/WNBA, where a real (if beatable)
# pack already exists. This kit exists to test that directly: capture the
# show live, run it through the real detector via `earshot replay`
# afterward, and see whether OUR decision lands ahead of wherever the
# market's eventual reaction comes from.
#
# STREAM: verified 2026-08-05 that `@TBPNLive`'s live URL resolves cleanly
# via yt-dlp (clean "channel is not currently live" error when off-air, no
# bot-wall/format issues) — same mechanism as WNT's @ABCNews/live. Show airs
# weekdays ~11am-2pm PT (18:00-21:00 UTC). Kalshi's KXTBPNMENTION board
# opens irregularly (12 events since 2025-10-23, gaps 4-98 days, currently
# 0 open) — watch with
# pm-expansion-exploration/latency/poll_new_market.py --series KXTBPNMENTION
# and only run this capture once a board is actually open (otherwise there
# is nothing to compare our detection against).
#
# WALL-CLOCK BRIDGE — verify before trusting either path, don't assume:
# a YouTube-live capture goes through HLS, which MAY carry
# #EXT-X-PROGRAM-DATE-TIME tags (WNT's stream did). If TBPN's manifest has
# them, prefer scripts/pdt-log.py + scripts/abs-lag.py (production,
# read-only references) — more precise than a bare anchor pair. If it
# doesn't, fall back to the already-proven
# pm-expansion-exploration/latency/mlb/wallclock_anchor.py (the plain
# (CLOCK_MONOTONIC_RAW, wall-clock) sample-pair technique — venue-agnostic,
# already works). Check the manifest for PDT tags once TBPN is live and
# pick the path that data supports; do not assume either way beforehand.
#
# PREFLIGHT CAVEAT: unlike KNBR's always-on radio stream,
# scripts/venue-probe.sh cannot usefully test this URL while TBPN is
# off-air (there is no live manifest to decode) — the preflight step here
# only becomes meaningful once the show is actually airing.
#
# RUN (once KXTBPNMENTION has an open event AND the show is about to air):
#   yt-dlp -g -f 233/234/bestaudio "https://www.youtube.com/@TBPNLive/live" \
#     > ~/tbpn-stream.url
#   scripts/venue-probe.sh "$(cat ~/tbpn-stream.url)" --secs 15 --json   # now meaningful
#   ORT_DYLIB_PATH=$(pwd)/vendor/onnxruntime/onnxruntime-osx-arm64-1.27.1/lib/libonnxruntime.dylib \
#   target/release/earshot capture-bakeoff \
#     --config pm-expansion-exploration/latency/tbpn/configs/tbpn-live-capture.toml \
#     --secs <show_len_plus_buffer> --record-dir <dir> --out <dir>/report.json
#
# Every leg declares 16000 Hz: preproc PANICS on any rate that is neither
# resample_to_hz nor half of it. Labels must be distinct (fanout requirement).

[event]
id        = "TBPN-LIVE-LADDER"
starts_at = "2026-08-05T18:00:00Z"  # placeholder — set to the real capture start each run

[pipeline]
chunk_ms = 80

# leg 1 — default ffmpeg fetch (baseline)
[[sources]]
kind = "pipe"
label = "default"
sample_rate_hz = 16000
cmd = [
  "/bin/sh", "-c",
  "ffmpeg -loglevel warning -i \"$(cat $HOME/tbpn-stream.url)\" -vn -f s16le -ac 1 -ar 16000 - 2>>${TBPN_DIR:-$HOME/tbpn-live}/default.err",
]

# leg 2 — low-latency tuned ffmpeg (the WNT/KNBR-proven flag set)
[[sources]]
kind = "pipe"
label = "tuned"
sample_rate_hz = 16000
cmd = [
  "/bin/sh", "-c",
  "ffmpeg -loglevel warning -fflags nobuffer -flags low_delay -probesize 32768 -analyzeduration 0 -reconnect 1 -reconnect_streamed 1 -reconnect_delay_max 2 -i \"$(cat $HOME/tbpn-stream.url)\" -vn -f s16le -ac 1 -ar 16000 - 2>>${TBPN_DIR:-$HOME/tbpn-live}/tuned.err",
]

# capture-bakeoff ignores trading config; the sections below only satisfy
# validation. NOTHING here is armed — no orders can be placed by this command.
[kalshi]
series = "KXTBPNMENTION"
env    = "prod"

[[keywords]]
market_ticker    = "KXTBPNMENTION-PLACEHOLDER"
phrase           = "placeholder"
variants         = ["placeholder"]
max_price_cents  = 1
budget_contracts = 1
policy           = "confirmed_only"
