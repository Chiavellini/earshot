# ── KNBR 680 (SF Giants flagship radio) — free-source acquisition-ladder
# capture kit (NOT armed). Modeled on configs/webcast-abcwnt-capture.toml's
# proven capture-only shape. Lives entirely under
# pm-expansion-exploration/latency/mlb/ — never registered in configs/,
# never referenced by any production script.
#
# STREAM: https://playerservices.streamtheworld.com/api/livestream-redirect/KNBRAM.mp3
# Triton Digital CDN, plain MP3/Icecast-style continuous stream (confirmed via
# curl+ffprobe: 200 OK, audio/mpeg, codec=mp3, 22050Hz stereo, 80kbps). The
# HLS variant (KNBRAM.m3u8) 403s — this is the only leg-worthy path, so BOTH
# legs below hit the same MP3 mount with different ffmpeg fetch tuning
# (default vs low-latency flags), mirroring the WNT acquisition-ladder
# pattern. This also satisfies capture-bakeoff's >=2-leg requirement.
#
# No PDT tags exist on this stream (it's not HLS), so the wall-clock bridge
# for this capture is pm-expansion-exploration/latency/mlb/wallclock_anchor.py
# (a fresh (MonotonicNs, wall-clock) sample-pair anchor), not scripts/pdt-log.py.
#
# RUN:
#   scripts/venue-probe.sh <url> --secs 30 --json   # preflight, already PASSED 2026-08-05
#   python3 pm-expansion-exploration/latency/mlb/wallclock_anchor.py --sample > <dir>/anchor.json
#   target/release/earshot capture-bakeoff \
#     --config pm-expansion-exploration/latency/mlb/configs/knbr-giants-capture.toml \
#     --secs <N> --record-dir <dir> --out <dir>/report.json
#
# Every leg declares 16000 Hz: preproc PANICS on any rate that is neither
# resample_to_hz nor half of it. Labels must be distinct (fanout requirement).

[event]
id        = "MLB-KNBR-GIANTS-LADDER"
starts_at = "2026-08-05T00:00:00Z"  # placeholder — set to the real capture start each run

[pipeline]
chunk_ms = 80

# leg 1 — default ffmpeg fetch (baseline)
[[sources]]
kind = "pipe"
label = "default"
sample_rate_hz = 16000
cmd = [
  "/bin/sh", "-c",
  "ffmpeg -loglevel warning -i https://playerservices.streamtheworld.com/api/livestream-redirect/KNBRAM.mp3 -vn -f s16le -ac 1 -ar 16000 - 2>>${MLB_DIR:-$HOME/mlb-knbr}/default.err",
]

# leg 2 — low-latency tuned ffmpeg (the WNT-proven flag set)
[[sources]]
kind = "pipe"
label = "tuned"
sample_rate_hz = 16000
cmd = [
  "/bin/sh", "-c",
  "ffmpeg -loglevel warning -fflags nobuffer -flags low_delay -probesize 32768 -analyzeduration 0 -reconnect 1 -reconnect_streamed 1 -reconnect_delay_max 2 -i https://playerservices.streamtheworld.com/api/livestream-redirect/KNBRAM.mp3 -vn -f s16le -ac 1 -ar 16000 - 2>>${MLB_DIR:-$HOME/mlb-knbr}/tuned.err",
]

# capture-bakeoff ignores trading config; the sections below only satisfy
# validation. NOTHING here is armed — no orders can be placed by this command.
[kalshi]
series = "KXMLBMENTION"
env    = "prod"

[[keywords]]
market_ticker    = "KXMLBMENTION-PLACEHOLDER-ERRO"
phrase           = "error"
variants         = ["error"]
max_price_cents  = 1
budget_contracts = 1
policy           = "confirmed_only"
