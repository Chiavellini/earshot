# Apartment (KXEARNINGSMENTIONTOL-26AUG18-APAR) — corpus-UNVALIDATED (engine defaults) — best-effort recall; cap: probe (non-crossing, no fill)
# Fill-path verifier — GATE (detection-accuracy program D2; enabled 2026-08-19
# for the doubled-size ruling). Every FILL-priced Confirmed intent is held until
# an offline Parakeet-TDT re-decode of the last 3.5 s of the firing leg either
# contains the word (send) or does not (refusal "verifier_veto"); a verdict that
# misses the budget SENDS (on_timeout = send), so a slow decode can only cost
# latency, never the trade. 1c observes never wait. Rehearsed 2026-08-19 04:45Z
# with the exact arm binary on the AS 26AUG18 tape: the "Arc'teryx"->tariff
# false fire that filled 96c on Monday was vetoed (decode 818 ms on this laptop
# with 4 threads; hence budget 1500 here, 500 on the box). At 20 contracts x 97c
# a false fire costs $19.40 and a true fire earns $0.60, so a false veto is cheap
# and a false fire is not. Rows land in report.json["verifier"].
[verifier]
mode        = "gate"
model_dir   = "models/sherpa-onnx-nemo-parakeet-tdt-0.6b-v2-int8"
model_type  = "nemo_transducer"
num_threads = 4
tail_ms     = 3500
budget_ms   = 1500
on_timeout  = "send"
sample      = "all_confirmed"
tickers     = ["*"]


[[keywords]]
market_ticker    = "KXEARNINGSMENTIONTOL-26AUG18-APAR"
phrase           = "apartment"
variants         = ["apartment", "apartments"]
max_price_cents  = 97  # posture: HIGH — study 78/18 ratio 4.33 >= floor 1.00
budget_contracts = 20  # posture: size 20 — ratio 4.33 tier, max 1940¢
policy           = "confirmed_only"

