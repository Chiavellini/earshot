# PCM-LEAD CONTROL — Tuesday 2026-07-28, Ford Q2, OpenExchange channel.
#
# Sibling of configs/pcm-lead-pypl.toml (Q4 Inc / IVS) and
# configs/pcm-lead-bakeoff.toml (the AWS IVS demo channel, LATENCY-PROOF §V5).
# OpenExchange is a FIFTH venue class, never measured — nothing is known about
# its prefetch posture going in. That is exactly why this config is staged but
# CONDITIONAL.
#
# ── CONDITIONAL — DO NOT RUN UNCONDITIONALLY ───────────────────────────────
# Run ONLY if the day-of probe (scripts/manifest-probe.sh against the live
# Ford m3u8) shows BOTH:
#   1. #EXT-X-PREFETCH PRESENT in the media playlist, AND
#   2. prefetch bodies served chunked (curl -sI shows Transfer-Encoding:
#      chunked, not Content-Length).
# If PREFETCH is ABSENT the two legs are identical and the comparison measures
# nothing; worse, `--stream-body` on whole-body origins is REFUTED (DW/Akamai:
# 3/32/62 short reads per run vs 0/0/0 buffered, jitter p99 12-18 ms vs ~1 ms).
# In that case do not run this config at all.
#
# ── WHY THIS RUNS ALONGSIDE THE ARM (when it runs) ─────────────────────────
# INTERLEAVED A/B WITHIN ONE RUN, NEVER ACROSS RUNS. Without a same-run
# baseline, whatever Δrace the armed event produces is a single number with
# nothing to attribute it to. These two legs sample the lead continuously for
# the length of the call.
#
# Cost: capture-bakeoff does NOT route through the detector pipeline
# (src/capture_bakeoff/mod.rs:12) — both legs are python-fetch + ffmpeg,
# ~1-2 % CPU each on the box. Politeness: +2 consumers on the origin.
# KILL THIS PAIR FIRST if anything rate-limit-shaped shows up (429/403),
# because a block hits every leg on the box, including the armed ones.
#
# ── RUN ───────────────────────────────────────────────────────────────────
#   echo "<ford m3u8>" > $HOME/ford-pcmab.url         # T-20, MASTER playlist
#   earshot capture-bakeoff --config configs/pcm-lead-ford.toml \
#           --secs 5400 --record-dir $HOME/pcmab-ford
#   scripts/leg-lag.py $HOME/pcmab-ford plain pfstream
#
# ⚠ SEPARATE URL FILE, DELIBERATELY. This reads $HOME/ford-pcmab.url, NOT
# $HOME/ford-stream.url. The runsheet's URL file and an instrument's must never
# alias each other: on 2026-07-27 a stale ~/pypl-stream.url left pointing at the
# AWS IVS demo channel would have captured the wrong stream while looking
# entirely normal. Two files means a mistake in one cannot silently poison both.
#
# ⚠ READING THE RESULT. `leg-lag.py` carries a NOT-STEADY guard. A wide spread
# is NOT noise — it IS the segment-phase distribution (§V5): a word at the head
# of a segment gains the full streamed lead, a word at the tail gains only what
# the buffered tier gives. Report median WITH n and spread; read min/max as the
# tail/head of the distribution. Never collapse it to one number.
#
# Demo-channel reference to compare against (§V3 arrival n=600, §V5 PCM n=8):
#   tail    +0.168 s / +0.170 s
#   average +1.121 s / +1.170 s
#   head    +2.073 s / +1.688 s (under-sampled)

[event]
id        = "PCM-LEAD-FORD"
starts_at = "2026-07-28T21:00:00Z"

[pipeline]
chunk_ms       = 80
resample_to_hz = 16000

# Leg 1 — BASELINE: manifest-driven, 250 ms phase-locked poll. This is exactly
# what the armed `spec_edge` leg runs as staged (no --prefetch), so this leg is
# not a straw man — it is the production posture as of this morning.
[[sources]]
kind = "pipe"
label = "plain"
sample_rate_hz = 16000
cmd = [
  "/bin/sh", "-c",
  "python3 $HOME/ear/scripts/hls-edge-fetch.py \"$(cat $HOME/ford-pcmab.url)\" 250 2 2>>$HOME/pcmab-ford-plain.err | ffmpeg -loglevel warning -fflags +discardcorrupt+nobuffer -flags low_delay -probesize 200000 -analyzeduration 3000000 -i - -vn -f s16le -ac 1 -ar 16000 -",
]

# Leg 2 — CANDIDATE: identical except `--prefetch --stream-body`. Fetches the
# #EXT-X-PREFETCH URLs the manifest names before announcing them, and emits each
# body progressively instead of buffering it whole. See the CONDITIONAL header —
# if the probe showed PREFETCH absent, this config should not be running.
[[sources]]
kind = "pipe"
label = "pfstream"
sample_rate_hz = 16000
cmd = [
  "/bin/sh", "-c",
  "python3 $HOME/ear/scripts/hls-edge-fetch.py \"$(cat $HOME/ford-pcmab.url)\" 250 2 --prefetch --stream-body 2>>$HOME/pcmab-ford-pfstream.err | ffmpeg -loglevel warning -fflags +discardcorrupt+nobuffer -flags low_delay -probesize 200000 -analyzeduration 3000000 -i - -vn -f s16le -ac 1 -ar 16000 -",
]

# capture-bakeoff places no orders and needs no Kalshi credentials. The keyword
# below exists only to satisfy config validation; nothing scores it.
[kalshi]
series = "PCM-LEAD-FORD"
env    = "prod"

[[keywords]]
market_ticker    = "PCM-LEAD-FORD-NOOP"
phrase           = "never spoken placeholder"
variants         = ["never spoken placeholder"]
max_price_cents  = 1
budget_contracts = 1
policy           = "confirmed_only"
