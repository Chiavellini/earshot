# TSLA Q2 2026 — WEBCAST STUDY CAPTURE (Wed 2026-07-22, ~5:30 PM ET = 21:30 UTC;
# verify exact time + watch URL ~30 min early — see configs/webcast-tsla.toml).
# LAPTOP-RUN (CDMX): YouTube bot-walls the AWS box; the yt-dlp path was proven
# from the laptop 2026-07-17 (RUNBOOK §Same-floor W1-pre). Driven by
# `earshot capture-bakeoff`: no orders, no Kalshi creds. Runs ALONGSIDE (or
# instead of) the webcast-tsla.toml observe arm — separate -CAPTURE state id.
# Two legs: yt-dlp default vs yt-dlp piped into low-latency ffmpeg. The HLS
# fetching lives INSIDE yt-dlp here, so ffmpeg's -live_start_index does not
# apply — the tuned leg measures only demux/buffer trims on this path
# (cross-delta vs leg 1 = what those trims buy; label it honestly in
# analysis). yt-dlp freshness rule: verify current yt-dlp + `--js-runtimes
# node` before the event (YouTube rejects Oct-2025 builds).
# Morning steps (laptop):
#   echo "<youtube watch/live URL>" > ~/tsla-stream.url
#   cargo run --release -- capture-bakeoff --config configs/webcast-tsla-capture.toml \
#     --secs 6600 --record-dir ~/tsla-capture --out ~/tsla-capture/report.json

[event]
id        = "KXEARNINGSMENTIONTSLA-26JUL22-CAPTURE"
starts_at = "2026-07-22T21:30:00Z"

[pipeline]
chunk_ms = 80

[[sources]]
kind = "pipe"
label = "ytdlp_default"
sample_rate_hz = 16000
cmd = [
  "/bin/sh", "-c",
  "yt-dlp --js-runtimes node -f 'worst*[acodec!=none]' -o - \"$(cat $HOME/tsla-stream.url)\" | ffmpeg -loglevel warning -i - -vn -f s16le -ac 1 -ar 16000 -",
]

[[sources]]
kind = "pipe"
label = "ytdlp_tuned"
sample_rate_hz = 16000
cmd = [
  "/bin/sh", "-c",
  "yt-dlp --js-runtimes node -f 'worst*[acodec!=none]' -o - \"$(cat $HOME/tsla-stream.url)\" | ffmpeg -loglevel warning -fflags nobuffer -flags low_delay -probesize 1000000 -analyzeduration 2000000 -i - -vn -f s16le -ac 1 -ar 16000 -",
]

[kalshi]
series = "KXEARNINGSMENTIONTSLA"
env = "prod"

[[keywords]]
market_ticker   = "KXEARNINGSMENTIONTSLA-26JUL22-CAPT"
phrase          = "robotaxi"
variants        = ["robotaxi", "robotaxis"]
max_price_cents = 1
budget_contracts = 1
policy          = "confirmed_only"
