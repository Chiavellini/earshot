# ^ COMMENTED OUT 2026-08-17, not deleted — this is the corpus-tuned sherpa_kws
# value and it lives nowhere else (this config is untracked), so it must survive
# a one-line revert of [detector].engine back to sherpa_kws.
# Why it is disabled: the CTC scorer does not implement `boost` and the runtime
# WARNs that it is IGNORED. That WARN goes to STDOUT, and
# execution-profile.sh:121 captures `earshot account-fingerprint` with $( ),
# which takes stdout only — so the WARN prepends itself to the sha256 line and
# validate_fingerprint's ^sha256:[0-9a-f]{64}$ fails, refusing the plan compile
# with the misleading "account-fingerprint did not emit exactly sha256:<64 hex>".
# Inert on this engine: no detection change, and keywords_sha256 covers
# ticker+phrase+variants only, so no readiness artifact is voided.

