# BOX-WEBCAST DRILL — the §8 integration rehearsal of docs/work/BOX-WEBCAST.md.
#
# THIS IS NOT AN EARNINGS CALL. There is no issuer, no venue, and no Kalshi
# board: `scripts/board-open.py --issuer BOXDRILL` returns exit 1 for both the
# open-board and the --any-status (ever-traded) question, verified
# 2026-08-14T15:4xZ. The audio is looped macOS `say` TTS of this file's own two
# keywords, served as a synthetic live HLS playlist from 127.0.0.1 ON THE BOX.
#
# Why the identity is shaped this way:
#   * `[event].id` deliberately does NOT match `KXEARNINGSMENTION[A-Z0-9]+-`, so
#     the drill cannot enter `missed-arm-check.py`'s denominator (:340-342).
#   * this file is named `-wc.toml`, not `-arm-wc.toml`, so it misses all five
#     of that same tool's staging globs (:325-327).
#   Belt and braces: a drill must be inert to every grader, in both directions.
#
# Posture: 1¢ non-crossing observe. `max_price_cents = 1` cannot cross any ask,
# so no order can fill by construction (the standing 26AUG11 ruling; precedent
# configs/rehearsal-nflx.toml). This is NOT optional politeness — the box
# scheduling path FORCES a live posture: `box-webcast-install.sh:88-89` refuses
# any plan that is not execution_enabled, and `install-event-timer.sh:201`
# hardcodes `ExecStart=… --i-am-live --fillable`. There is no dry-run door on
# this path, so the 1¢ cap and the absent board ARE the safety envelope.

[event]
id        = "BOXDRILL-26AUG14-WEBCAST"
starts_at = "2026-08-30T20:00:00Z"

[pipeline]
chunk_ms       = 80
resample_to_hz = 16000

[detector]
engine = "streaming_ctc"

[detector.streaming_ctc]
model_dir         = "models/sherpa-onnx-streaming-zipformer-ctc-small-2024-03-18"
num_threads       = 1
default_threshold = 0.15
refractory_ms     = 2000

[arbiter]
mode = "fanout"

# Both legs read the url-file the PRERESOLVED resolver waits for. The literal
# `$HOME/` spelling is mandatory: access-plan.py:244-261 refuses `${HOME}/` and
# `~/` because arm-on-url.sh:102-105 expands only this one form on the box.
[[sources]]
kind = "pipe"
label = "streamlink"
sample_rate_hz = 16000
cmd = [
  "/bin/sh", "-c",
  "streamlink --stdout --hls-live-edge 1 --hls-segment-stream-data --hls-playlist-reload-time segment \"$(cat $HOME/boxdrill-stream.url)\" best | ffmpeg -loglevel warning -fflags nobuffer -flags low_delay -probesize 2000000 -analyzeduration 5000000 -i - -vn -f s16le -ac 1 -ar 16000 -",
]

# The stock tuned-ffmpeg backstop (configs/webcast-fanout-arm.toml:56-61). The
# AMAT cachebust override is deliberately NOT used: this venue is a localhost
# origin with no CDN in front, and cdn-cachebust-fetch.sh never exits by design
# (the C7 wedge class).
[[sources]]
kind = "pipe"
label = "pipe_tuned"
sample_rate_hz = 16000
cmd = [
  "/bin/sh", "-c",
  "ffmpeg -loglevel warning -fflags nobuffer -flags low_delay -probesize 2000000 -analyzeduration 5000000 -live_start_index -1 -http_persistent 1 -reconnect 1 -reconnect_streamed 1 -reconnect_delay_max 2 -i \"$(cat $HOME/boxdrill-stream.url)\" -vn -f s16le -ac 1 -ar 16000 -",
]

# ALLOWLIST RETARGETED 2026-08-14T17:1xZ. `arm` validates every allowlist ticker
# against Kalshi at start-up and refuses on 404, so the original fake BOXDRILL-*
# tickers could never reach source_attached — the SIGTERM kill drill was
# unreachable BY CONSTRUCTION. These two are AMAT 26AUG13's markets, measured
# status=finalized with yes_ask=None: fetchable (200, so validation passes) but
# SETTLED, so there is still NO OPEN BOARD and a fill is impossible on three
# independent grounds — market closed, no ask to cross, and a 1¢ non-crossing
# cap. The [event].id stays BOXDRILL-26AUG14-WEBCAST, so every state and
# evidence path stays in the drill's own tree and AMAT's real event is untouched.
[kalshi]
series = "KXEARNINGSMENTIONAMAT"
env    = "prod"

[risk]
# 1 contract × 1¢ = 1¢ of theoretical exposure against a board that does not
# exist. Caps sized to the rehearsal-nflx precedent, far under both
# PROBE_LEDGER_CAP_CENTS and the src/risk.rs hard caps, which are untouched.
max_order_notional_cents = 100
max_event_notional_cents = 100
book_stale_ms            = 2000
audio_stale_ms           = 2000
allowlist_tickers = [
  "KXEARNINGSMENTIONAMAT-26AUG13-SCRE",
  "KXEARNINGSMENTIONAMAT-26AUG13-CHIN",
]

# Two words chosen because the AMAT 26AUG13 study already measured them as the
# strongest on this exact engine: screen 74 confirmed / 18 clips, china 76 / 36.
# A drill must exercise the detector, not test it.
[[keywords]]
market_ticker    = "KXEARNINGSMENTIONAMAT-26AUG13-SCRE"
phrase           = "screen"
variants         = ["screen", "screens"]
max_price_cents  = 1  # OBSERVE — non-crossing by construction, no fill possible
budget_contracts = 1
policy           = "confirmed_only"

[[keywords]]
market_ticker    = "KXEARNINGSMENTIONAMAT-26AUG13-CHIN"
phrase           = "china"
variants         = ["china", "chinas", "chinese", "chineses"]
max_price_cents  = 1  # OBSERVE — non-crossing by construction, no fill possible
budget_contracts = 1
policy           = "confirmed_only"
