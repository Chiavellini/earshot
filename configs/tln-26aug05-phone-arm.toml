# WEBCAST FANOUT ARM TEMPLATE — direct-m3u8 events (IR players, FOMC).
# The production armed posture from the 07-22 race findings (docs/RACE-STRATEGY.md §5):
#   leg 1 "streamlink"  — edge-join primary: the measured ladder winner
#                         (−11.7..−13.65 s vs default join, RUNBOOK 07-17 + 07-20)
#   leg 2 "pipe_tuned"  — tuned-ffmpeg backstop (-live_start_index -1 = the only
#                         flag that moves the join point; −10.6..−11.65 s vs default)
# Both legs run FULL detect chains OR-ed at the one-shot decision table
# ([arbiter] mode = "fanout") — different legs hear different audio (07-22 TARI).
#
# Instantiate per event with scripts/stage-webcast-arm.sh, then:
#   1. paste the `earshot prepare` keyword/risk sections over the placeholders,
#   2. on call morning write the m3u8:  echo "<m3u8>" > ~/<lc>-stream.url
#   3. launch attended: scripts/launch-webcast.sh --config <this> --account <env> \
#        --wait-live ~/<lc>-stream.url --wait-kind hls
# The live gate lives in launch-webcast.sh (NEVER inside a source cmd —
# 07-22 post-mortems #1/#2). YouTube events: do NOT use this template; keep
# the frozen yt-dlp leg (configs/webcast-tsla.toml) until a streamlink-vs-
# YouTube ladder number exists (capture first).
# PHONE-ONLY arm (operator ruling 2026-08-05): Talen publishes a participant
# dial-in, and when a dial-in exists the webcast lag is large enough that a
# webcast leg only adds load and false comfort (CMG 26JUL29: phone 4.1-8.2 s
# AHEAD of the webcast on the SAME call). The two HLS legs were REMOVED.
# Consequence: there is NO webcast fallback for TLN — the phone leg is the
# ONLY capture path, so it must arm even if admission cannot be re-proven.
# Was: dual-lane variant of webcast-tln-26aug05-arm-wc.toml.
# Identical [[keywords]] (same keywords_sha256 -> same readiness study/ack).
# Posture: MENTION-FILL (2026-08-05 operator ruling, W7 lifted for this slate):
# max_price_cents = 97 (MENTION_FILL_CAP_CENTS ceiling, raised 50->97 26AUG05),
# budget_contracts = 1 (97x2=194c would exceed max_order_notional_cents=100),
# min_confidence_confirmed = 0.22 (26AUG05 tape: all 5 NO markets fired
#   0.152-0.217, everything >=0.24 settled YES; IN-SAMPLE n=26, NOT validated)
# => orders MAY cross and fill, ONE ~97c contract per event. Spend double-bound per event
# by [risk].max_event_notional_cents=100 and the per-event $1 probe ledger.
# Prior posture: mention-probe observe (1¢ non-crossing) — fill posture was gated on
# the Phase-4 precision verdict (docs/RACE-STRATEGY.md).

[event]
id        = "KXEARNINGSMENTIONTLN-26AUG05-WEBCAST"
starts_at = "2026-08-05T20:30:00Z"

[pipeline]
chunk_ms       = 80
resample_to_hz = 16000

[detector]
engine = "streaming_ctc"

[detector.streaming_ctc]
model_dir         = "models/sherpa-onnx-streaming-zipformer-ctc-small-2024-03-18"
num_threads       = 1
default_threshold = 0.15
refractory_ms     = 2000

# sherpa_kws block kept so the engine reverts with a one-line change above.

[detector.sherpa_kws]
model_dir         = "models/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01"
num_threads       = 1
max_active_paths  = 4
default_threshold = 0.20
default_boost     = 2.0
refractory_ms     = 2000
fp32              = true

# NO [arbiter] section — deliberate. `fanout` requires >= 2 sources
# (config.rs:704) and this arm has exactly one (the phone leg), so the default
# single-source arbiter is correct. Matches configs/twilio-cmg-26jul29-arm.toml
# and twilio-aapl-26jul30-arm.toml, which also omit it.

[[sources]]
# PHONE LANE (leg 0) — the measured lead: 26JUL29 CMG put phone 4.1-8.2 s AHEAD
# of the webcast on the SAME call, +1 recall win. Shape copied from the proven
# dual-lane config configs/webcast-amd-26aug04-arm-wc.toml (26AUG04).
# max_reconnects/idle_timeout_secs are the Q-REDIAL production values; they
# require EARSHOT_REDIAL_DIR, which launch-event.sh exports (config.rs:588).
# Bridge: registration-unlocked (bdelriom@actinver.com.mx). Number + PIN are
# passed on the launch-event.sh command line and stay OUT of git.
kind = "twilio_stream"
bind = "127.0.0.1:8093"
max_reconnects = 2
idle_timeout_secs = 8

[kalshi]
series = "KXEARNINGSMENTIONTLN"
env = "prod"

# ── Placeholders below: replace with the `earshot prepare` output ──────────
[risk]
max_order_notional_cents = 100
max_event_notional_cents = 100
book_stale_ms            = 2000
audio_stale_ms           = 2000
allowlist_tickers = [
  "KXEARNINGSMENTIONTLN-26AUG05-AFFO",
  "KXEARNINGSMENTIONTLN-26AUG05-AMAZ",
  "KXEARNINGSMENTIONTLN-26AUG05-ANTH",
