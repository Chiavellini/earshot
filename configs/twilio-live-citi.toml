# Live verification run — Citigroup Q2 2026 earnings call, 2026-07-14 11:00 AM ET
# (dial-in 805-309-2350, passcode 7142026#, per docs/history/RUNBOOK.md).
#
# Cloned from configs/twilio-live.toml (JPM). Same posture: mention-probe
# (arm --i-am-live --allow-mention). 1¢ × 1 contract per tranche, non-crossing
# → posted but guaranteed NO FILL. The point is timing + order acceptance on a
# real mention market, not P&L. Real-size trading stays gated until M4.
#
# Tickers verified live 2026-07-14 against
# https://external-api.kalshi.com/trade-api/v2/markets?event_ticker=KXEARNINGSMENTIONC-26JUL14
# — all 14 markets status=active; TARI=Tariff, RECE=Recession, INFL=Inflation.
# Keyword blocks reused verbatim from JPM (issuer-independent, corpus-tuned).

[event]
id        = "CITI-Q2-2026"
starts_at = "2026-07-14T15:00:00Z"

[pipeline]
chunk_ms       = 80
resample_to_hz = 16000

[detector]
engine = "sherpa_kws"

[detector.sherpa_kws]
model_dir         = "models/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01"
num_threads       = 1
max_active_paths  = 4
default_threshold = 0.20
default_boost     = 2.0
refractory_ms     = 2000
fp32              = true          # fp32 encoder: recall win, FA down on tariff/recession (docs/BAKEOFF.md)

[[sources]]
kind = "twilio_stream"
bind = "127.0.0.1:8080"          # ngrok fronts this; Twilio connects wss://

[kalshi]
series = "KXEARNINGSMENTIONC"

[risk]
max_order_notional_cents = 100
max_event_notional_cents = 100
book_stale_ms            = 2000
audio_stale_ms           = 2000
allowlist_tickers = [
  "KXEARNINGSMENTIONC-26JUL14-TARI",
  "KXEARNINGSMENTIONC-26JUL14-RECE",
  "KXEARNINGSMENTIONC-26JUL14-INFL",
]

[[keywords]]
market_ticker    = "KXEARNINGSMENTIONC-26JUL14-TARI"
phrase           = "tariff"
variants         = ["tariff", "tariffs"]
max_price_cents  = 1
budget_contracts = 1
policy           = "confirmed_only"
confirmed_threshold = 0.10
boost            = 3.0

[[keywords]]
market_ticker    = "KXEARNINGSMENTIONC-26JUL14-RECE"
phrase           = "recession"
variants         = ["recession", "recessions"]
max_price_cents  = 1
budget_contracts = 1
policy           = "confirmed_only"
confirmed_threshold = 0.28

[[keywords]]
market_ticker    = "KXEARNINGSMENTIONC-26JUL14-INFL"
phrase           = "inflation"
variants         = ["inflation"]
max_price_cents  = 1
budget_contracts = 1
policy           = "confirmed_only"
