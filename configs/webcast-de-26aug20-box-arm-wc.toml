# AI / Artificial Intelligence (KXEARNINGSMENTIONDE-26AUG20-AI) — corpus-UNVALIDATED (engine defaults) — best-effort recall; cap: probe (non-crossing, no fill) ; ⚠ compound/symbol phrase — review variants
