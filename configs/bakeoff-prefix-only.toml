# PREFIX-GATE SCORING CONFIG — the 7 keywords that actually carry a
# fast_prefix, and nothing else.
#
# WHY THIS EXISTS: the D2 prefix gate is scored against NEGATIVE-CONTROL calls
# (corpus/manifests/{axp,vz}-q2-2026.toml) whose manifests declare ZERO
# occurrences, which makes every detection a false alarm by construction. That
# is only sound if the audio contains none of the SCORED keywords — and those
# calls will legitimately say "record", "government" and so on. Scoring them
# with the full 41-keyword set would count real mentions as false alarms and
# inflate FA/h.
#
# So: score the negative controls with THIS config, never with
# bakeoff-webcast-prefix.toml.
#
# Three of the seven are not impossible on a financial/telecom call — "venture
# fund", "world cup", "basic economy". A fire on any of those must be verified
# against the audio before being counted. The other four are product/programme
# names belonging to other issuers and are safe.
#
# Webcast-domain bake-off keyword config (docs/BAKEOFF.md §Webcast fill-tier
# promotion gate, pre-registered 2026-07-23). Union of the LMT/AAL/INTC 07-23
# event keyword sets (41 phrases; iran + tariff shared across events).
# Tickers are placeholders — bench-detector only, nothing touches Kalshi.
# BASELINE state = engine defaults for every keyword (exactly what the 07-23
# live arms ran: "corpus-UNVALIDATED (engine defaults)"); dev tuning edits
# per-keyword thresholds/boost here, holdout runs whatever is frozen.

[event]
id        = "WEBCAST-BAKEOFF"
starts_at = "2026-07-30T21:00:00Z"

[pipeline]
chunk_ms       = 160
resample_to_hz = 16000

[detector]
engine = "sherpa_kws"

[detector.sherpa_kws]
model_dir         = "models/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01"
num_threads       = 1
max_active_paths  = 4
default_threshold = 0.20
default_boost     = 2.0
refractory_ms     = 2000

[detector.streaming_ctc]
model_dir         = "models/sherpa-onnx-streaming-zipformer-ctc-small-2024-03-18"
num_threads       = 1
default_threshold = 0.15

[[sources]]                      # unused by bench-detector (corpus supplies audio)
kind = "replay"
path = "unused.wav"

[kalshi]
series = "KXEARNINGSMENTION"

[[keywords]]
market_ticker    = "KX-BENCH-BASICECONOMY"
phrase           = "basic economy"
fast_prefixes    = ["basic ec"]
fast_threshold   = 0.15
variants         = ["basic economy"]
max_price_cents  = 97
budget_contracts = 1
policy           = "two_tier"

[[keywords]]
