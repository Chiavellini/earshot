# MS-26JUL15 all-keywords TTS rehearsal — LOG-ONLY, NO TRADING.
# Run with `earshot replay` (intent_tx = None: no Kalshi connection, no orders).
# Mirrors configs/twilio-live-ms.toml detector settings exactly (chunk 80 ms,
# fp32, same thresholds/boosts) so per-word detection results transfer to the
# live run. Tickers are inert placeholders under replay.
#
#   ngrok http 8080
#   TWILIO_STREAM_URL=wss://<host>/media cargo run --release -- replay --config configs/twilio-loopback-ms.toml
#   → place a call whose TwiML <Say>s the 14 phrases (outbound_track)

[event]
id        = "MS-KEYWORDS-REHEARSAL"
starts_at = "2026-07-15T00:00:00Z"

[pipeline]
chunk_ms       = 80
resample_to_hz = 16000

[detector]
engine = "sherpa_kws"

[detector.sherpa_kws]
model_dir         = "models/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01"
num_threads       = 1
max_active_paths  = 4
default_threshold = 0.20
default_boost     = 2.0
refractory_ms     = 2000
fp32              = true

[[sources]]
kind = "twilio_stream"
bind = "127.0.0.1:8080"

[kalshi]
series = "KXEARNINGSMENTIONMS"

[[keywords]]
market_ticker    = "REHEARSAL-BASE"
phrase           = "basel"
variants         = ["basel", "basels"]
max_price_cents  = 1
budget_contracts = 1
policy           = "confirmed_only"

