# PCM-LEAD A/B — is the 32 KB READ QUANTUM worth what the model says, in the PCM domain?
#
# THE CLAIM UNDER TEST (docs/LATENCY-PROOF.md §Q1/§Q2). `stream_to`'s read size is
# denominated in BYTES, and `r.read(chunk)` BLOCKS until `chunk` bytes arrive. An
# origin still writing a segment dribbles at roughly the media rate, so a fixed
# 32768-byte read costs `chunk / bitrate` SECONDS on every word — and the cost
# scales INVERSELY with rendition bitrate, which is why it is worst at exactly the
# audio-only venues we lose at (Chorus Call 71 kbps => 3.68 s projected).
#
# Measured so far: 1.107 s quantum cost at 230 kbps (predicted 1.140 s), and a
# 1.005 s median first-byte lead in the ARRIVAL domain (n=75 paired segments).
# What has NOT been measured is whether that survives ffmpeg and the pipe — i.e.
# whether earlier BYTES become earlier PCM. `capture_ns` is stamped where audio
# enters the pipeline (src/source/pipe.rs:161), so this rig answers exactly that.
#
#   earshot capture-bakeoff --config configs/pcm-lead-chunkms.toml \
#           --secs 900 --record-dir $HOME/pcmab-chunkms
#   scripts/leg-lag.py $HOME/pcmab-chunkms q32k q40ms
#
# Read the number from leg-lag.py, NEVER from capture-bakeoff's own `delta_ms`:
# that field is `start_skew + content_lag` extrapolated from frame 0, so on a live
# HLS join it measures JOIN LUCK. It is what produced the formally retracted
# "-6016 ms then 0 ms, both peak 1.0000" pair.
#
# ── ⚠ THE TRAP THIS CONFIG EXISTS TO AVOID ─────────────────────────────────
# `--chunk-ms` is a NO-OP without `--stream-body`. `read_chunk()` reaches the
# fetch only via `fetch_segment(url, out, timeout, a.stream_body, read_chunk())`,
# and `fetch_segment` IGNORES `chunk` entirely on the buffered path. The stock
# pcm-lead-*.toml baseline leg is plain-buffered, so a copy-paste
# "plain vs --chunk-ms" A/B would have measured `--stream-body` and reported a
# large bogus win. BOTH legs below run `--stream-body`; ONLY `--chunk-ms` differs.
# That is the entire point of this file — do not "simplify" leg 1.
#
# ── TARGET: the demo channel's LOWEST rendition, on purpose ────────────────
# The axis that governs effect size is BITRATE, not venue identity. The demo
# master's cheapest rendition is 230 kbps — ~3x closer to Chorus Call's 71 kbps
# than anything measured before — and `pick_variant()` selects it automatically
# when handed the master. $HOME/chunkms-pcmab.url must therefore hold the MASTER
# url, not a variant. Deliberately a SEPARATE url file from any runsheet's, so a
# stale arm URL can never alias into this measurement.
#
# ── PRE-REGISTERED BAR (fixed before the run) ──────────────────────────────
#   * leg-lag.py median steady-state lead >= 0.30 s in favour of q40ms
#   * its NOT STEADY guard (spread > 500 ms) tripping is a NOT RESOLVABLE
#     verdict, NOT a retry-until-it-passes
#   * short = 0 and dropped = 0 on BOTH legs
#   * CONSISTENCY CHECK: complete-lag must be unchanged between legs. Streaming
#     cannot alter when the origin finishes writing a segment; if that moves, the
#     instrument is wrong and the result is void.

[event]
id        = "PCM-LEAD-CHUNKMS"
starts_at = "2026-07-30T00:00:00Z"

[pipeline]
chunk_ms       = 80
resample_to_hz = 16000

# Leg 1 — BASELINE: streamed body, LEGACY 32768-byte read quantum (--chunk-ms
# defaults to 0, which keeps the historical constant byte-identically).
[[sources]]
kind = "pipe"
label = "q32k"
sample_rate_hz = 16000
cmd = [
  "/bin/sh", "-c",
  "python3 $HOME/hls-edge-fetch-r1.py \"$(cat $HOME/chunkms-pcmab.url)\" 250 2 --prefetch --stream-body --arrival-log $HOME/pcmab-q32k.arrival 2>>$HOME/pcmab-q32k.err | ffmpeg -loglevel warning -fflags +discardcorrupt+nobuffer -flags low_delay -probesize 200000 -analyzeduration 3000000 -i - -vn -f s16le -ac 1 -ar 16000 -",
]

# Leg 2 — CANDIDATE: identical in every respect except `--chunk-ms 40`, i.e. each
# read blocks for at most ~40 ms of MEDIA instead of a fixed 32768 bytes.
[[sources]]
kind = "pipe"
label = "q40ms"
sample_rate_hz = 16000
cmd = [
  "/bin/sh", "-c",
  "python3 $HOME/hls-edge-fetch-r1.py \"$(cat $HOME/chunkms-pcmab.url)\" 250 2 --prefetch --stream-body --chunk-ms 40 --arrival-log $HOME/pcmab-q40ms.arrival 2>>$HOME/pcmab-q40ms.err | ffmpeg -loglevel warning -fflags +discardcorrupt+nobuffer -flags low_delay -probesize 200000 -analyzeduration 3000000 -i - -vn -f s16le -ac 1 -ar 16000 -",
]

# capture-bakeoff places no orders and needs no Kalshi credentials. The keyword
# below exists only to satisfy config validation; nothing scores it.
[kalshi]
series = "PCM-LEAD-CHUNKMS"
env    = "prod"

[[keywords]]
market_ticker    = "PCM-LEAD-CHUNKMS-NOOP"
phrase           = "never spoken placeholder"
variants         = ["never spoken placeholder"]
max_price_cents  = 1
budget_contracts = 1
policy           = "confirmed_only"
