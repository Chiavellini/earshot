# KXEARNINGSMENTIONSPCX-26AUG04 — webcast arm config, generated 2026-08-04 by scripts/stage-afternoon-26aug04.py
#
# VENUE: resolved at ~T-0 into $HOME/spcx-stream.url. All four 2026-08-04
# afternoon events are `bridge_unpublished` (no dial-in in any scanned 8-K, and
# none published on the IR page), so this is the only lane. If a dial-in turns
# up, add a twilio_stream leg -- do not replace these.
#
# Posture: 1c mention-probe observe (non-crossing). Fill posture stays gated on
# the unscored Phase-4 precision verdict.

[event]
id        = "KXEARNINGSMENTIONSPCX-26AUG04-WEBCAST"
starts_at = "2026-08-04T20:30:00Z"

[pipeline]
chunk_ms       = 80
resample_to_hz = 16000

[detector]
engine = "streaming_ctc"

[detector.streaming_ctc]
model_dir         = "models/sherpa-onnx-streaming-zipformer-ctc-small-2024-03-18"
num_threads       = 1
default_threshold = 0.15
refractory_ms     = 2000

# Kept so the engine reverts in a one-line change above.
[detector.sherpa_kws]
model_dir         = "models/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01"
num_threads       = 1
max_active_paths  = 4
default_threshold = 0.20
default_boost     = 2.0
refractory_ms     = 2000
fp32              = true

[arbiter]
mode = "fanout"

[[sources]]
kind = "pipe"
label = "streamlink"
sample_rate_hz = 16000
cmd = [
  "/bin/sh", "-c",
  "streamlink --stdout --hls-live-edge 1 --hls-segment-stream-data --hls-playlist-reload-time segment \"$(cat $HOME/spcx-stream.url)\" best | ffmpeg -loglevel warning -fflags nobuffer -flags low_delay -probesize 2000000 -analyzeduration 5000000 -i - -vn -f s16le -ac 1 -ar 16000 -",
]

[[sources]]
kind = "pipe"
label = "pipe_tuned"
sample_rate_hz = 16000
cmd = [
  "/bin/sh", "-c",
  "ffmpeg -loglevel warning -fflags nobuffer -flags low_delay -probesize 2000000 -analyzeduration 5000000 -live_start_index -1 -http_persistent 1 -reconnect 1 -reconnect_streamed 1 -reconnect_delay_max 2 -i \"$(cat $HOME/spcx-stream.url)\" -vn -f s16le -ac 1 -ar 16000 -",
]

[kalshi]
series = "KXEARNINGSMENTIONSPCX"
env = "prod"

[risk]
max_order_notional_cents = 100
max_event_notional_cents = 100
book_stale_ms            = 2000
audio_stale_ms           = 2000
allowlist_tickers = [
  "KXEARNINGSMENTIONSPCX-26AUG04-ANTH",
  "KXEARNINGSMENTIONSPCX-26AUG04-ARTE",
