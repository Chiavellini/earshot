# TWILIO PHONE-LANE ARM — YUM 2026-07-30 12:15Z. Generated from
# webcast-yum-26jul30-arm-wc.toml: keywords/allowlist/risk IDENTICAL; only
# [[sources]] differs (twilio_stream :8080; no [arbiter] — single source).
# Runs CONCURRENTLY with the -WEBCAST lane (distinct [event].id ⇒ distinct
# state dir, so run-arm guard 8 sees two different events —
# docs/history/PHONE-LANE-HANDOFF.md §7.3).
#
# Bind-port plan (MULTI-EVENT §8): YUM phone 8080, AAPL phone 8081 — this event owns :8080.
# The two phone events do not overlap in time but ports stay distinct anyway.
# max_reconnects=2 / idle_timeout_secs=8 are the Q-REDIAL production values
# (pinned 2026-07-29 night).
#
# ⚠ streaming_ctc dlopens onnxruntime: the launcher MUST export
# ORT_DYLIB_PATH or the detector build hangs AFTER the WS bind (Recv-Q on the
# listener is the tell — docs/history/PHONE-LANE-HANDOFF.md §2.1; launch-event.sh exports
# it since commit 0e0e2bd).
# Operator-screened bridge (Class B): [operator_handler] below is the
# admission path — launch with --operator-handler.

[event]
id        = "KXEARNINGSMENTIONYUM-26JUL30"
starts_at = "2026-07-30T12:15:00Z"

[pipeline]
chunk_ms       = 80
resample_to_hz = 16000

[detector]
engine = "streaming_ctc"

[detector.streaming_ctc]
model_dir         = "models/sherpa-onnx-streaming-zipformer-ctc-small-2024-03-18"
num_threads       = 1
default_threshold = 0.15
refractory_ms     = 2000

# sherpa_kws block kept so the engine can be reverted with a one-line change to
# `engine =` above, without re-deriving thresholds under time pressure.
[detector.sherpa_kws]
model_dir         = "models/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01"
num_threads       = 1
max_active_paths  = 4
default_threshold = 0.20
default_boost     = 2.0
refractory_ms     = 2000
fp32              = true

[[sources]]
kind = "twilio_stream"
bind = "127.0.0.1:8080"
max_reconnects    = 2
idle_timeout_secs = 8

# YUM's bridge is operator-screened (Class B, probed 2026-07-29 night): the
# human-first operator handler IS the admission path (docs/OPERATOR-HANDLER.md).
# enabled=true is only half the gate — the dial script also requires
# --operator-i-am-paged (launch-event.sh --operator-handler wires both).
[operator_handler]
enabled           = true
cell_number       = "+525545436717"
conference_prefix = "earshot"

[kalshi]
series = "KXEARNINGSMENTIONYUM"
env = "prod"

[risk]
max_order_notional_cents = 100
max_event_notional_cents = 100
book_stale_ms            = 2000
audio_stale_ms           = 2000
allowlist_tickers = [
  "KXEARNINGSMENTIONYUM-26JUL30-AI",
  "KXEARNINGSMENTIONYUM-26JUL30-BEEF",
  "KXEARNINGSMENTIONYUM-26JUL30-BUYB",
  "KXEARNINGSMENTIONYUM-26JUL30-BYTE",
  "KXEARNINGSMENTIONYUM-26JUL30-CRISP",
  "KXEARNINGSMENTIONYUM-26JUL30-CYCL",
  "KXEARNINGSMENTIONYUM-26JUL30-FOOD",
  "KXEARNINGSMENTIONYUM-26JUL30-LETT",
  "KXEARNINGSMENTIONYUM-26JUL30-LONG",
  "KXEARNINGSMENTIONYUM-26JUL30-LOWI",
  "KXEARNINGSMENTIONYUM-26JUL30-LUXE",
  "KXEARNINGSMENTIONYUM-26JUL30-OUTB",
  "KXEARNINGSMENTIONYUM-26JUL30-RECA",
  "KXEARNINGSMENTIONYUM-26JUL30-SAUC",
  "KXEARNINGSMENTIONYUM-26JUL30-TAYL",
  "KXEARNINGSMENTIONYUM-26JUL30-TRAF",
  "KXEARNINGSMENTIONYUM-26JUL30-VALU",
  "KXEARNINGSMENTIONYUM-26JUL30-YUMC",
]

