# WEBCAST-ONLY FANOUT ARM (G3 PRIMARY, autonomous): two edge-join legs OR'd at
# the decision table. Morning: echo "<m3u8>" > ~/lmt-stream.url then
#   scripts/launch-webcast.sh --config configs/webcast-lmt-arm.toml \
#     --account ~/.earshot/lmt.env --bin <pinned> --wait-live ~/lmt-stream.url --wait-kind hls

[arbiter]
mode = "fanout"

[[sources]]
kind = "pipe"
label = "streamlink"
sample_rate_hz = 16000
cmd = [
  "/bin/sh", "-c",
  "streamlink --stdout --hls-live-edge 1 --hls-segment-stream-data --hls-playlist-reload-time segment \"$(cat $HOME/lmt-stream.url)\" best | ffmpeg -loglevel warning -fflags nobuffer -flags low_delay -probesize 65536 -analyzeduration 1000000 -i - -vn -f s16le -ac 1 -ar 16000 -",
]

[[sources]]
kind = "pipe"
label = "pipe_tuned"
sample_rate_hz = 16000
cmd = [
  "/bin/sh", "-c",
  "ffmpeg -loglevel warning -fflags nobuffer -flags low_delay -probesize 65536 -analyzeduration 1000000 -live_start_index -1 -http_persistent 1 -reconnect 1 -reconnect_streamed 1 -reconnect_delay_max 2 -i \"$(cat $HOME/lmt-stream.url)\" -vn -f s16le -ac 1 -ar 16000 -",
]

