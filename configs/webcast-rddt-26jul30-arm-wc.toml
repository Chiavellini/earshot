# RDDT 2026-07-30 20:30Z — WEBCAST LANE.
# Generated 2026-07-30 from `earshot prepare --event-ticker KXEARNINGSMENTIONRDDT-26JUL30`
# (live Kalshi API), keywords/allowlist/risk verbatim; sources/detector follow
# the 07-29 speculative 2-leg fanout pattern below.
#
# WEBCAST FANOUT ARM — SPECULATIVE POSTURE + streaming_ctc DETECTOR.
#
# Differs from configs/webcast-fanout-arm-spec.toml ONLY in the detector engine.
# Legs, flags and politeness budget are identical, so everything the speculative
# template says below still applies verbatim.
#
# ── WHY streaming_ctc (docs/LATENCY-PROOF.md D1b/D1c/D1d/D1e, 2026-07-25) ──
# Holdout (AAL, 1.51 h, unseen, run ONCE with the config frozen):
#
#                     sherpa_kws   streaming_ctc
#   true positives            15              15     identical
#   misses                     3               3     identical
#   recall                 0.833           0.833     identical
#   total fired               41              23     -18
#   FA/h                   17.21            5.30     -69 %
#   consumed_lag p50        540 ms         540 ms     no regression
#
# It catches exactly the same words and fires 18 fewer times. ZERO recall cost.
# Dev agreed in direction (-38 % FA/h); the holdout is larger. A false alarm buys
# YES on a market that settles NO, so this is the axis that costs money.
#
# ── WHAT IT COSTS, stated plainly ─────────────────────────────────────────
# RTF 0.1518 vs 0.0689 = 2.2x, and `build_detector` runs PER LEG
# (src/main.rs:627,638), so with 2 legs on 2 vCPU each leg owns a core:
#
#   burst drain (2 s AXP-class burst)   sherpa_kws 138 ms   streaming_ctc 304 ms
#
# That +166 ms lands on the CRITICAL PATH, and specifically in the ~25 % of words
# that E0 showed already pay a whole segment — the worst case gets worse. This is
# a deliberate accuracy-for-latency trade, not a free win. Revert = one line.
#
# The earlier "-300 ms CTC is faster" reading was an INSTRUMENT ARTIFACT (D1c):
# the engines reported different quantities under one field name. Race on
# `consumed_lag`, never on `emit_lag`.
#
# ── ⚠ HARD REQUIREMENT: ORT_DYLIB_PATH ────────────────────────────────────
# streaming_ctc loads onnxruntime dynamically. If ORT_DYLIB_PATH is unset the
# detector FAILS TO BUILD and the arm dies at startup — with launchd's minimal
# env this is exactly the class of failure CLAUDE.md warns about. The launcher
# MUST export it:
#
#   export ORT_DYLIB_PATH="$HOME/ear/$(cd $HOME/ear && find vendor -name 'libonnxruntime*.so*' | head -1)"
#
# Verify BEFORE the call, not during it: a dry-run arm must reach "source
# finished" and not "streaming_ctc: ..." in the error path.
#
# Same as configs/webcast-fanout-arm.toml except leg 1: the speculative
# edge-fetcher REPLACES the streamlink leg (leg count stays 2, so CPU on the
# 2-vCPU box is unchanged).
#
#   leg 1 "spec_edge"   — scripts/hls-edge-fetch.py --speculative: fetches the
#                         NEXT segment by predicted URL instead of waiting for
#                         the manifest to announce it, and streams the body
#                         progressively rather than buffering it whole.
#   leg 2 "pipe_tuned"  — tuned-ffmpeg backstop, unchanged. NOT a "reliable"
#                         fallback: pooled over 11 runs its absolute lag spans
#                         12.0-19.2 s (7.22 s of join lottery — the LARGEST of
#                         the three legs; an early 2-sample reading of 0.13 s was
#                         retracted). It is a diversity/failure backstop only.
#                         What protects the race is the fanout OR-at-decision,
#                         and only while spec_edge is actually working — hence
#                         the per-venue GO/NO-GO probe before arming.
#
# WHY (docs/LATENCY-PROOF.md 2026-07-24, parts 1-3). The race gap is NOT decode:
# on AXP NFL it decomposed to 1.241 s FEED + 0.289 s OURS. A segment is
# fetchable by predicted URL ~1.0-1.4 s BEFORE the manifest announces it
# (+1.02 s at 6 s segments, +1.40 s at 1.92 s segments — a fixed origin
# property, most likely manifest CDN cache TTL). Measured over 6 interleaved
# runs: spec_edge 12.50 s median absolute lag vs prod_tuned 16.95 s, and — the
# bigger win for racing — a 0.91 s run-to-run spread vs 4.9-6.5 s. The join
# lottery costs up to 6.5 s FOR A WHOLE EVENT; this removes it.
#
# streamlink is dropped: it measured worst on both axes (17.18 s median,
# 4.94 s spread) and is the erratic joiner. Trade-off accepted knowingly — a
# leg is also a source of recall diversity (07-22 TARI: different legs hear
# different audio), and we are down to two draws instead of three.
#
# ⚠ MORE AGGRESSIVE than a normal HLS client: it spends 404s to buy latency.
# The politeness budget is in the script (probe from 80% of a segment, <=15
# probes/segment, ANY 429/403 permanently disables speculation and falls back
# to manifest-driven). A rate-limit would hit EVERY leg on the box, which is
# why FOMC 2026-07-29 deliberately runs the non-speculative template instead.
#
# The fetcher's stderr is redirected per-leg because the arm logs pipe stderr at
# `debug` (src/source/pipe.rs) and would otherwise hide catch-up drops — the
# fetcher DROPS AUDIO to catch up, and silent loss is a recall bug. Check
# ~/<lc>_spec_edge.err (SUMMARY lines) after every run. The stderr path is
# per-event (2026-07-28): a shared ~/spec_edge.err interleaved two events'
# diagnostics the day PYPL and F both ran. The arrival log is on by default —
# it is the boundable-race artifact (first PDT→first-byte) and costs nothing.
#
# ⚠ probesize=200000 / analyzeduration=3000000 — robustness, keep it.
# Some streams do not give ffmpeg enough to identify the AAC track inside
# 65536/1000000 and it exits during startup with "Could not find codec
# parameters ... unspecified sample rate/format", killing the leg before a
# single sample. Reproduced 2026-07-25 on a 1.92 s-segment stream, where it
# killed BOTH this leg and a direct-URL ffmpeg leg (so it is NOT a pipe-vs-URL
# effect — an earlier note here claiming that was wrong). streamlink survived it,
# because it demuxes before ffmpeg sees the bytes.
#
# NOT a general short-segment law: AXP/IVS at 2 s segments captured 488,306
# frames with 0 drops at 65536. It is stream-specific AAC signalling. The bump
# is free insurance — these flags measured ~0 ms in steady state, so the only
# cost is a slightly longer startup probe, and 200000 (~1.5 segments here) stays
# well under the pipeline's 30 s idle guard.
#
# Instantiate with:  scripts/stage-webcast-arm.sh --speculative <lc> <EV> <ISO>
# then follow the same steps as the base template.

[event]
id        = "KXEARNINGSMENTIONRDDT-26JUL30"
starts_at = "2026-07-30T20:30:00Z"

[pipeline]
chunk_ms       = 80
resample_to_hz = 16000

[detector]
engine = "streaming_ctc"

[detector.streaming_ctc]
model_dir         = "models/sherpa-onnx-streaming-zipformer-ctc-small-2024-03-18"
num_threads       = 1
default_threshold = 0.15
refractory_ms     = 2000

# sherpa_kws block kept so the engine can be reverted with a one-line change to
# `engine =` above, without re-deriving thresholds under time pressure.
[detector.sherpa_kws]
model_dir         = "models/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01"
num_threads       = 1
max_active_paths  = 4
default_threshold = 0.20
default_boost     = 2.0
refractory_ms     = 2000
fp32              = true

[arbiter]
mode = "fanout"

[[sources]]
kind = "pipe"
label = "spec_edge"
sample_rate_hz = 16000
cmd = [
  "/bin/sh", "-c",
  "python3 $HOME/ear/scripts/hls-edge-fetch.py \"$(cat $HOME/rddt-stream.url)\" 250 2 --speculative --prefetch --stream-body --prefetch-report --arrival-log $HOME/rddt-arrival.log 2>>$HOME/rddt_spec_edge.err | ffmpeg -loglevel warning -fflags +discardcorrupt+nobuffer -flags low_delay -probesize 200000 -analyzeduration 3000000 -i - -vn -f s16le -ac 1 -ar 16000 -",
]

[[sources]]
kind = "pipe"
label = "pipe_tuned"
sample_rate_hz = 16000
cmd = [
  "/bin/sh", "-c",
  "ffmpeg -loglevel warning -fflags nobuffer -flags low_delay -probesize 2000000 -analyzeduration 5000000 -live_start_index -1 -http_persistent 1 -reconnect 1 -reconnect_streamed 1 -reconnect_delay_max 2 -i \"$(cat $HOME/rddt-stream.url)\" -vn -f s16le -ac 1 -ar 16000 -",
]

[kalshi]
series = "KXEARNINGSMENTIONRDDT"
env = "prod"

[risk]
max_order_notional_cents = 100
max_event_notional_cents = 100
book_stale_ms            = 2000
audio_stale_ms           = 2000
allowlist_tickers = [
  "KXEARNINGSMENTIONRDDT-26JUL30-ALGO",
  "KXEARNINGSMENTIONRDDT-26JUL30-DEVE",
  "KXEARNINGSMENTIONRDDT-26JUL30-GAME",
  # GOOG is the Google 3-plus-times market — a CUMULATIVE COUNT market.
  # prepare skips said-N-times markets because this pipeline fires on first
  # utterance and cannot count, so it gets no keyword block and can never
  # fire. It is allowlisted anyway so allowlist-diff.sh (which compares the
  # ALLOWLIST against the live board) exits 0 instead of reporting
  # LIVE-NOT-ARMED. Without it, every board carrying a count market FAILs
  # preflight, and the gate stops meaning Kalshi-listed-something-we-missed.
  # NOTE: no double quotes and no square brackets inside this array comment —
  # allowlist-diff.sh parses the array with a non-greedy match to the first
  # closing bracket and then greps every quoted string as a ticker.
  "KXEARNINGSMENTIONRDDT-26JUL30-GOOG",
  "KXEARNINGSMENTIONRDDT-26JUL30-HEAD",
  "KXEARNINGSMENTIONRDDT-26JUL30-MACH",
