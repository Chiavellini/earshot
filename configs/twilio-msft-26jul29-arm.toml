# webcast-msft-26jul29-arm.toml: keywords/allowlist/risk IDENTICAL; only
# [[sources]] differs (twilio_stream :8082; no [arbiter] — single source).
# Runs CONCURRENTLY with the -WEBCAST lane (distinct [event].id ⇒ distinct
