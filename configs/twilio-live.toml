# First live verification run — JPMorgan Q2 2026 earnings call,
# Tuesday 2026-07-14 8:30 AM ET (dial-in 888-324-3618, passcode 1364784#,
# static/no registration — pinned by the 2026-07-11 call inventory).
#
# Posture: mention-probe (arm --i-am-live --allow-mention). 1¢ IOC × 1
# contract per tranche, $1 cumulative ledger. The point is timing + order
# acceptance on a real mention market, not P&L.
#
# Detector: sherpa_kws Confirmed-only — the M1 holdout verdict says Fast-tier
# latency is not competitive (p95 1066 ms) and confirmed precision is
# 0.95–1.0. tariff/recession thresholds are the FROZEN bake-off values.
#
# Variants VERIFIED against state/rules/*.json (drill 4, 2026-07-12): all
# three are single-utterance markets ("If X is said ... resolves to Yes",
# no "said N times" strike → one-shot decision table applies), all
# can_close_early=true, and the rules count "the exact word or a plural or
# possessive form" — so tariff/tariffs, recession/recessions, inflation are
# the right coverage (spoken possessive ≡ plural to the KWS tokenizer).

[event]
id        = "JPM-Q2-2026"
starts_at = "2026-07-14T12:30:00Z"

[pipeline]
# 80 ms, not 160: chunk accumulation is the dominant BUDGETED pipeline latency
# (capture→decision p95 ≈ one chunk; tests/perf_budget.rs perf_full_chain_paced
# bounds it at chunk+10ms), so halving the chunk removes ~80 ms from every
# detection. chunk_ms is a pure latency dial — re-verified 2026-07-14 on
# AAPL-Q2-2026: tariff Confirmed recall 0.89 / prec 1.00 / 0 FA is bit-identical
# at chunk 40/80/160 (docs/BAKEOFF.md). 80 is the spec production value; the
# earlier 160 here was a regression. (40 is also accuracy-safe, pending an RTF
# check — perf_detector_rtf.)
chunk_ms       = 80
resample_to_hz = 16000

[detector]
engine = "sherpa_kws"

[detector.sherpa_kws]
model_dir         = "models/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01"
num_threads       = 1
max_active_paths  = 4
default_threshold = 0.20
default_boost     = 2.0
refractory_ms     = 2000
fp32              = true          # fp32 encoder: recall win, FA down on tariff/recession (docs/BAKEOFF.md)

[[sources]]
kind = "twilio_stream"
bind = "127.0.0.1:8080"          # ngrok fronts this; Twilio connects wss://

[kalshi]
series = "KXEARNINGSMENTIONJPM"

[risk]
max_order_notional_cents = 100
book_stale_ms            = 2000
audio_stale_ms           = 2000   # detection sits ~1 chunk behind capture; 1 s default is too tight
allowlist_tickers = [
  "KXEARNINGSMENTIONJPM-26JUL14-TARI",
  "KXEARNINGSMENTIONJPM-26JUL14-RECE",
  "KXEARNINGSMENTIONJPM-26JUL14-INFL",
]

# Corpus-validated keyword (holdout precision 1.0 at these thresholds).
[[keywords]]
market_ticker    = "KXEARNINGSMENTIONJPM-26JUL14-TARI"
phrase           = "tariff"
variants         = ["tariff", "tariffs"]
max_price_cents  = 1
budget_contracts = 1
policy           = "confirmed_only"
confirmed_threshold = 0.10
boost            = 3.0

# Corpus false-alarm control in the bake-off; positive-recall untested but
# precision-safe at the frozen threshold.
[[keywords]]
market_ticker    = "KXEARNINGSMENTIONJPM-26JUL14-RECE"
phrase           = "recession"
variants         = ["recession", "recessions"]
max_price_cents  = 1
budget_contracts = 1
policy           = "confirmed_only"
confirmed_threshold = 0.28

# NOT corpus-tuned — running at engine defaults to gather live data; still
# 1¢ bounded like everything else.
[[keywords]]
market_ticker    = "KXEARNINGSMENTIONJPM-26JUL14-INFL"
phrase           = "inflation"
variants         = ["inflation"]
max_price_cents  = 1
budget_contracts = 1
policy           = "confirmed_only"
