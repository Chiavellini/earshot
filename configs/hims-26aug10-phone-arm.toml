# ── OPERATOR-SCREENED BRIDGE (Class B) — added live 2026-08-10T21:1xZ ────────
# The 21:07Z probe transcript proved this venue screens: "If you know your
# unique passcode, please enter it now. Otherwise to speak to the next
# available operator stay on the line… Please have your first and last name…
# I'm not able to hear anything." Meeting ID 782 611 911 is the WEBCAST id,
# not a participant passcode, so every silent leg fell through to a human and
# was hung up at 83-153 s. Q-CONF (2026-07-30) proved a <Start><Stream
# track="inbound_track"> fork keeps carrying bridge audio while the call sits
# in <Dial><Conference>, and that the paged human's voice stays OFF the
# inbound track — so this is the designed admission path, not a workaround.
[operator_handler]
enabled           = true
cell_number       = "+525545436717"
conference_prefix = "earshot"
