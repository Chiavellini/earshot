# TWILIO PHONE-LANE ARM — AAPL 2026-07-30 21:00Z. Generated from
# webcast-aapl-26jul30-arm-wc.toml: keywords/allowlist/risk IDENTICAL; only
# [[sources]] differs (twilio_stream :8081; no [arbiter] — single source).
# Runs CONCURRENTLY with the -WEBCAST lane (distinct [event].id ⇒ distinct
# state dir, so run-arm guard 8 sees two different events —
# docs/history/PHONE-LANE-HANDOFF.md §7.3).
#
# Bind-port plan (MULTI-EVENT §8): YUM phone 8080, AAPL phone 8081 — this event owns :8081.
# The two phone events do not overlap in time but ports stay distinct anyway.
# max_reconnects=2 / idle_timeout_secs=8 are the Q-REDIAL production values
# (pinned 2026-07-29 night).
#
# ⚠ streaming_ctc dlopens onnxruntime: the launcher MUST export
# ORT_DYLIB_PATH or the detector build hangs AFTER the WS bind (Recv-Q on the
# listener is the tell — docs/history/PHONE-LANE-HANDOFF.md §2.1; launch-event.sh exports
# it since commit 0e0e2bd).

[event]
id        = "KXEARNINGSMENTIONAAPL-26JUL30"
starts_at = "2026-07-30T21:00:00Z"

[pipeline]
chunk_ms       = 80
resample_to_hz = 16000

[detector]
engine = "streaming_ctc"

[detector.streaming_ctc]
model_dir         = "models/sherpa-onnx-streaming-zipformer-ctc-small-2024-03-18"
num_threads       = 1
default_threshold = 0.15
refractory_ms     = 2000

# sherpa_kws block kept so the engine can be reverted with a one-line change to
# `engine =` above, without re-deriving thresholds under time pressure.
[detector.sherpa_kws]
model_dir         = "models/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01"
num_threads       = 1
max_active_paths  = 4
default_threshold = 0.20
default_boost     = 2.0
refractory_ms     = 2000
fp32              = true

[[sources]]
kind = "twilio_stream"
bind = "127.0.0.1:8081"
max_reconnects    = 2
idle_timeout_secs = 8

[kalshi]
series = "KXEARNINGSMENTIONAAPL"
env = "prod"

[risk]
max_order_notional_cents = 100
book_stale_ms            = 2000
audio_stale_ms           = 2000
allowlist_tickers = [
  "KXEARNINGSMENTIONAAPL-26JUL30-APPL",
  "KXEARNINGSMENTIONAAPL-26JUL30-BROA",
  "KXEARNINGSMENTIONAAPL-26JUL30-CREA",
  "KXEARNINGSMENTIONAAPL-26JUL30-F1",
  "KXEARNINGSMENTIONAAPL-26JUL30-FOLD",
  "KXEARNINGSMENTIONAAPL-26JUL30-FRID",
  "KXEARNINGSMENTIONAAPL-26JUL30-GEMI",
  "KXEARNINGSMENTIONAAPL-26JUL30-IPHO",
  "KXEARNINGSMENTIONAAPL-26JUL30-LIQU",
  # M3 has no keyword block (no variant survives the detector vocab), so it
  # can never fire. It is allowlisted anyway because allowlist-diff.sh compares the
  # ALLOWLIST against the live board: leaving a live market out makes it exit 1
  # (LIVE-NOT-ARMED, the WING-INDI class) and FAILs preflight, which cannot tell a
  # deliberate exclusion from an oversight. Allowlisted-but-keywordless reports
  # ARMED-NO-KEYWORD and exits 0 — same posture as -OPEN above.
  "KXEARNINGSMENTIONAAPL-26JUL30-M3",
  "KXEARNINGSMENTIONAAPL-26JUL30-MANU",
  "KXEARNINGSMENTIONAAPL-26JUL30-MODE",
  "KXEARNINGSMENTIONAAPL-26JUL30-OPEN",
  "KXEARNINGSMENTIONAAPL-26JUL30-SIRI",
  "KXEARNINGSMENTIONAAPL-26JUL30-SPOR",
  "KXEARNINGSMENTIONAAPL-26JUL30-STRE",
  "KXEARNINGSMENTIONAAPL-26JUL30-TARI",
  "KXEARNINGSMENTIONAAPL-26JUL30-WIDG",
]

