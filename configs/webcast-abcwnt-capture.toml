# ── ABC WORLD NEWS TONIGHT — acquisition-ladder STUDY kit (NOT armed) ────────
# Daily market: KXWORLDNEWSMENTION (category Mentions), event
# KXWORLDNEWSMENTION-<yyMONdd>, sub_title "any host or reporter - ABC World
# News Tonight with David Muir". Airs 6:30 PM ET = 22:30Z = 16:30 CDMX,
# ~22 min. First pinned 2026-07-29 (see VERIFICATIONS Q-WNT).
#
# PURPOSE: measure how many seconds behind the encoder each OBTAINABLE feed
# runs, because the question that motivated this lane — "capture ABC off
# analog AM/FM near the transmitter" — is closed:
#   * WNT audio is NOT carried on AM/FM. ABC News Radio is a separate product
#     (top-of-hour bureau newscasts), not a simulcast of the Muir broadcast.
#   * No cloud VM (incl. EC2 bare metal) exposes USB/RF. RF needs hardware at
#     a physical US address; none available.
#   * HD Radio stations delay their ANALOG signal 8-10 s to blend-align with
#     the digital carrier, so analog FM is often BEHIND, not ahead.
#   * SiriusXM ch.796 does carry WNT but is app-only (not on the satellite
#     carrier) at ~145-155 s end-to-end.
# What IS left is the ladder between internet feeds — worth seconds, which is
# where every measured win on this project has come from (tuned ffmpeg -10.6 s;
# speculative edge-fetch 12.50 s absolute vs 16.95-17.18 s streamlink/tuned).
#
# RUN (laptop — residential IP; the datacenter box is YouTube bot-walled,
# docs/RACE-STRATEGY.md:159):
#   yt-dlp -g -f 233/234/bestaudio "https://www.youtube.com/@ABCNews/live" \
#     > ~/abcwnt-stream.url
#   scripts/pdt-log.py "$(cat ~/abcwnt-stream.url)" 250 2700 > ~/abcwnt/pdt.jsonl &
#   target/release/earshot capture-bakeoff --config configs/webcast-abcwnt-capture.toml \
#     --secs 2700 --record-dir ~/abcwnt --out ~/abcwnt/report.json
# THEN: scripts/leg-lag.py (steady-state leg A/B on real capture_ns),
#       scripts/abs-lag.py + pdt.jsonl (absolute lag vs the encoder — headline),
#       scripts/arrival-lead.py on the two --arrival-log files,
#       scripts/fetch-tape.sh KXWORLDNEWSMENTION-<yyMONdd> for the Δrace.
#
# Every leg declares 16000 Hz: preproc PANICS on any rate that is neither
# resample_to_hz nor half of it. Labels must be distinct (fanout requirement).

[event]
id        = "WEBCAST-ABCWNT-LADDER"
starts_at = "2026-07-29T22:30:00Z"

[pipeline]
chunk_ms = 80

# leg 1 — phase-locked speculative edge fetcher (our best-measured acquisition)
[[sources]]
kind = "pipe"
label = "spec_edge"
sample_rate_hz = 16000
cmd = [
  "/bin/sh", "-c",
  "python3 $HOME/Code/ear/scripts/hls-edge-fetch.py \"$(cat $HOME/abcwnt-stream.url)\" 250 2 --speculative --prefetch --stream-body --prefetch-report --arrival-log ${WNT_DIR:-$HOME/abcwnt}/spec_edge.arrival.log 2>>${WNT_DIR:-$HOME/abcwnt}/spec_edge.err | ffmpeg -loglevel warning -fflags +discardcorrupt+nobuffer -flags low_delay -probesize 200000 -analyzeduration 3000000 -i - -vn -f s16le -ac 1 -ar 16000 -",
]

# leg 2 — tuned ffmpeg (the landed production flag set)
[[sources]]
kind = "pipe"
label = "pipe_tuned"
sample_rate_hz = 16000
cmd = [
  "/bin/sh", "-c",
  "ffmpeg -loglevel warning -fflags nobuffer -flags low_delay -probesize 1000000 -analyzeduration 2000000 -live_start_index -1 -http_persistent 1 -reconnect 1 -reconnect_streamed 1 -reconnect_delay_max 2 -i \"$(cat $HOME/abcwnt-stream.url)\" -vn -f s16le -ac 1 -ar 16000 - 2>>${WNT_DIR:-$HOME/abcwnt}/pipe_tuned.err",
]

# leg 3 — streamlink low-latency (streams bytes out of in-progress downloads)
[[sources]]
kind = "pipe"
label = "streamlink"
sample_rate_hz = 16000
cmd = [
  "/bin/sh", "-c",
  "streamlink --stdout --hls-live-edge 1 --hls-segment-stream-data --hls-playlist-reload-time segment \"$(cat $HOME/abcwnt-stream.url)\" best 2>>${WNT_DIR:-$HOME/abcwnt}/streamlink.err | ffmpeg -loglevel warning -fflags nobuffer -flags low_delay -probesize 1000000 -analyzeduration 2000000 -i - -vn -f s16le -ac 1 -ar 16000 -",
]

# capture-bakeoff ignores trading config; the sections below only satisfy
# validation. NOTHING here is armed — no orders can be placed by this command.
[kalshi]
series = "KXWORLDNEWSMENTION"
env    = "prod"

[[keywords]]
market_ticker    = "KXWORLDNEWSMENTION-26JUL29-TRUM"
phrase           = "trump"
variants         = ["trump"]
max_price_cents  = 1
budget_contracts = 1
policy           = "confirmed_only"
