# PCM-LEAD CONTROL — Tuesday 2026-07-28, PayPal Q2, the REAL Q4 Inc channel.
#
# Sibling of configs/pcm-lead-bakeoff.toml, which measured the same quantity on
# the AWS IVS **demo** channel (LATENCY-PROOF §V5). Everything Campaign 2 knows
# about #EXT-X-PREFETCH comes from that one demo channel, which loops every
# 180.2 s and capped the PCM sample at n=8. This config is the first run of the
# instrument against a real issuer's channel with non-looping audio.
#
# ── WHY THIS RUNS ALONGSIDE THE ARM, AND WHY IT IS NOT OPTIONAL ────────────
# The standing rule is INTERLEAVED A/B WITHIN ONE RUN, NEVER ACROSS RUNS.
# Without a same-run baseline, whatever Δrace the armed event produces is a
# single number with nothing to attribute it to — and PayPal will yield only a
# handful of price-moving sweeps against an OURS term that E0 showed is a
# segment-phase lottery with ~±2 s spread. A handful of draws CANNOT resolve a
# 1.12 s improvement. These two legs can: they sample the lead continuously for
# the length of the call.
#
# ── COST, MEASURED NOT ASSUMED ────────────────────────────────────────────
# `capture-bakeoff` "does NOT route through the detector pipeline"
# (src/capture_bakeoff/mod.rs:12) — no ONNX, no detect threads. Both legs are
# python-fetch + ffmpeg, measured on the box at ~1-2 % CPU each while the 90-min
# gate was running. They cannot contend with the armed CTC legs, which own
# ~2 vCPU apiece by design (D1i-b).
#
# Politeness: this adds 2 consumers, for 4 total on Q4's origin (2 armed +
# 2 passive). Negligible for IVS — but KILL THIS PAIR FIRST if anything
# rate-limit-shaped shows up (429/403), because a block hits every leg on the
# box, including the armed ones.
#
# ── RUN ───────────────────────────────────────────────────────────────────
#   echo "<pypl m3u8>" > $HOME/pypl-pcmab.url        # T-20, same URL as the arm
#   earshot capture-bakeoff --config configs/pcm-lead-pypl.toml \
#           --secs 5400 --record-dir $HOME/pcmab-pypl
#   scripts/leg-lag.py $HOME/pcmab-pypl plain pfstream
#
# ⚠ SEPARATE URL FILE, DELIBERATELY. This reads $HOME/pypl-pcmab.url, NOT
# $HOME/pypl-stream.url. The runsheet's URL file and an instrument's must never
# alias each other: on 2026-07-27 a stale ~/pypl-stream.url left pointing at the
# AWS IVS demo channel would have captured the wrong stream while looking
# entirely normal. Two files means a mistake in one cannot silently poison both.
#
# ⚠ READING THE RESULT. `leg-lag.py` carries a NOT-STEADY guard. On this
# quantity a wide spread is NOT noise and NOT a broken instrument — it IS the
# segment-phase distribution (§V5): a word at the head of a segment gains the
# full streamed lead, a word at the tail gains only what the buffered tier
# gives, because the last byte lands at the same instant either way. Report
# median WITH n and spread, and read min/max as the tail/head of the
# distribution. Never collapse it to one number.
#
# Demo-channel reference to compare against (§V3 arrival n=600, §V5 PCM n=8):
#   tail    +0.168 s / +0.170 s
#   average +1.121 s / +1.170 s
#   head    +2.073 s / +1.688 s (under-sampled)

[event]
id        = "PCM-LEAD-PYPL"
starts_at = "2026-07-28T12:00:00Z"

[pipeline]
chunk_ms       = 80
resample_to_hz = 16000

# Leg 1 — BASELINE: manifest-driven, 250 ms phase-locked poll. This is exactly
# what the armed `spec_edge` leg degrades to on IVS, since numeric speculation
# self-disables against opaque signed segment URLs. So this leg is not a straw
# man — it is the production posture as of this morning.
[[sources]]
kind = "pipe"
label = "plain"
sample_rate_hz = 16000
cmd = [
  "/bin/sh", "-c",
  "python3 $HOME/ear/scripts/hls-edge-fetch.py \"$(cat $HOME/pypl-pcmab.url)\" 250 2 2>>$HOME/pcmab-pypl-plain.err | ffmpeg -loglevel warning -fflags +discardcorrupt+nobuffer -flags low_delay -probesize 200000 -analyzeduration 3000000 -i - -vn -f s16le -ac 1 -ar 16000 -",
]

# Leg 2 — CANDIDATE: identical except `--prefetch --stream-body`. Fetches the
# #EXT-X-PREFETCH URLs the manifest names before announcing them, and emits each
# body progressively instead of buffering it whole.
#
# ⚠ If the day-of probe shows EXT-X-PREFETCH ABSENT on Q4's channel, this leg
# measures nothing and `--stream-body` actively degrades it (REFUTED on
# DW/Akamai: 3/32/62 short reads per run vs 0/0/0 buffered, jitter p99 12-18 ms
# vs ~1 ms). In that case do not run this config at all — there is no lever to
# measure and the result would be a comparison of two damaged legs.
[[sources]]
kind = "pipe"
label = "pfstream"
sample_rate_hz = 16000
cmd = [
  "/bin/sh", "-c",
  "python3 $HOME/ear/scripts/hls-edge-fetch.py \"$(cat $HOME/pypl-pcmab.url)\" 250 2 --prefetch --stream-body 2>>$HOME/pcmab-pypl-pfstream.err | ffmpeg -loglevel warning -fflags +discardcorrupt+nobuffer -flags low_delay -probesize 200000 -analyzeduration 3000000 -i - -vn -f s16le -ac 1 -ar 16000 -",
]

# capture-bakeoff places no orders and needs no Kalshi credentials. The keyword
# below exists only to satisfy config validation; nothing scores it.
[kalshi]
series = "PCM-LEAD-PYPL"
env    = "prod"

[[keywords]]
market_ticker    = "PCM-LEAD-PYPL-NOOP"
phrase           = "never spoken placeholder"
variants         = ["never spoken placeholder"]
max_price_cents  = 1
budget_contracts = 1
policy           = "confirmed_only"
