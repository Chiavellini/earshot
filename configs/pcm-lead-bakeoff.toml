# PCM-LEAD A/B — does the prefetch arrival lead SURVIVE ffmpeg?
#
# Every prefetch number measured so far (LATENCY-PROOF §V1–V3) is ARRIVAL at the
# fetcher's stdout, taken with output to /dev/null: `--prefetch --stream-body`
# delivers a **+2.073 s first-byte lead** (n=600, IQR [+2.014, +2.129]).
# Whether ffmpeg converts earlier BYTES into earlier PCM — and whether the pipe's
# backpressure eats the gain — was never measured, so none of it is proven to
# reach the detector.
#
# This config measures the surviving lead at the PIPE SOURCE, i.e. AFTER ffmpeg:
#   earshot capture-bakeoff --config configs/pcm-lead-bakeoff.toml \
#           --secs 900 --record-dir ~/pcmab
#   scripts/leg-lag.py ~/pcmab plain pfstream
# `capture_ns` is stamped where audio enters the pipeline, which is exactly the
# quantity the race table needs and `--arrival-log` cannot see.
#
# Two legs ONLY, differing in ONE flag, so the delta is attributable. Distinct
# `label`s are mandatory — identical labels collide on the recording filename.
#
# Before running:  echo "<master-or-media-m3u8>" > $HOME/ivsdemo-stream.url
# Deliberately NOT `$HOME/pypl-stream.url`: that file is the event runsheet's,
# and a stale copy of it silently captured the wrong stream once already.
#
# ⚠ leg-lag.py carries a NOT-STEADY guard. A wide window spread means the legs
# were not in steady state and the median must not be quoted.

[event]
id        = "PCM-LEAD-BAKEOFF"
starts_at = "2026-07-27T00:00:00Z"

[pipeline]
chunk_ms       = 80
resample_to_hz = 16000

# Leg 1 — BASELINE: manifest-driven, 250 ms phase-locked poll. This is what the
# production `spec_edge` leg degrades to on IVS, since numeric speculation
# self-disables against opaque signed segment URLs.
[[sources]]
kind = "pipe"
label = "plain"
sample_rate_hz = 16000
cmd = [
  "/bin/sh", "-c",
  "python3 $HOME/ear/scripts/hls-edge-fetch.py \"$(cat $HOME/ivsdemo-stream.url)\" 250 2 2>>$HOME/pcmab-plain.err | ffmpeg -loglevel warning -fflags +discardcorrupt+nobuffer -flags low_delay -probesize 200000 -analyzeduration 3000000 -i - -vn -f s16le -ac 1 -ar 16000 -",
]

# Leg 2 — CANDIDATE: identical except `--prefetch --stream-body`. Fetches the
# #EXT-X-PREFETCH URLs the manifest names before announcing them, and emits each
# body progressively instead of buffering it whole.
[[sources]]
kind = "pipe"
label = "pfstream"
sample_rate_hz = 16000
cmd = [
  "/bin/sh", "-c",
  "python3 $HOME/ear/scripts/hls-edge-fetch.py \"$(cat $HOME/ivsdemo-stream.url)\" 250 2 --prefetch --stream-body 2>>$HOME/pcmab-pfstream.err | ffmpeg -loglevel warning -fflags +discardcorrupt+nobuffer -flags low_delay -probesize 200000 -analyzeduration 3000000 -i - -vn -f s16le -ac 1 -ar 16000 -",
]

# capture-bakeoff places no orders and needs no Kalshi credentials. The keyword
# below exists only to satisfy config validation; nothing scores it.
[kalshi]
series = "PCM-LEAD-BAKEOFF"
env    = "prod"

[[keywords]]
market_ticker    = "PCM-LEAD-BAKEOFF-NOOP"
phrase           = "never spoken placeholder"
variants         = ["never spoken placeholder"]
max_price_cents  = 1
budget_contracts = 1
policy           = "confirmed_only"
