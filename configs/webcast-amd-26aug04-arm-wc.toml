# MI450 / MI455X (KXEARNINGSMENTIONAMD-26AUG04-MI45) — corpus-UNVALIDATED (engine defaults) — best-effort recall; cap: probe (non-crossing, no fill) ; ⚠ compound/symbol phrase — review variants
# DROPPED ultra-short variant "mi" — <3 chars matches a syllable, not a word (measured: 38 FA in one event set). Re-add deliberately if this phrasing matters, and own the precision cost.
# DROPPED ultra-short variant "mis" — <3 chars matches a syllable, not a word (measured: 38 FA in one event set). Re-add deliberately if this phrasing matters, and own the precision cost.
#
# ⚠ KNOWN PREFLIGHT FAIL, ACCEPTED 2026-08-04 WITH EVIDENCE — do not "fix" by
# editing variants without reading this first.
#   preflight-event.sh (market-phrase-screen.py) FAILs this market:
#     "market resolves on 'MI450 / MI455X' (needs mi450 OR mi455x);
#      armed variants ['mi four fifty', ...] fire without resolving the market"
#   That screen does a TEXTUAL match and is right about the Windows-11 class it
#   was built for (armed "windows" cannot resolve a market needing "Windows 11").
#   It is WRONG here, and the live rules say why — GET /markets/KXEARNINGSMENTIONAMD-26AUG04-MI45:
#     rules_primary:   "If MI450 / MI455X is SAID by any ... representative ...
#                       during the ... earnings call (including the Q+A)"
#     rules_secondary: "VIDEO of the ... call will be primarily used to resolve"
#   Resolution is on what is SPOKEN, not on a written token. A speaker saying
#   "em-eye four fifty" IS saying MI450, and that is the only form a streaming
#   CTC detector can ever emit from audio — "mi450" as a keyword is unspeakable
#   and would match nothing. The armed spoken forms are therefore CORRECT and
#   the screen is a false positive for spelled-number product names.
#   Left armed deliberately. Posture is 1c non-crossing confirmed_only, so even
#   if this reasoning were wrong a false fire costs the order, not a position.
#   TODO(next session): market-phrase-screen.py needs a spoken-form exemption
#   (or a .acks/<config>-phrase-screen.ack path, mirroring the short-token gate)
#   so this is an ACK rather than a standing FAIL that trains people to ignore
#   preflight. A gate everyone overrides is the flagged-but-unenforced pattern
#   that lost WING's CITR+AI.
[[keywords]]
market_ticker    = "KXEARNINGSMENTIONAMD-26AUG04-MI45"
phrase           = "mi four fifty"
variants         = ["mi four fifty", "em eye four fifty", "m i four fifty", "mi four five zero", "mi four fifty five x"]
max_price_cents  = 1
budget_contracts = 1
policy           = "confirmed_only"

