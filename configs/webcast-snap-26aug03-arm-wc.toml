# SNAP Q2 2026 — official Q4 attendee page:
#   https://events.q4inc.com/attendee/997870973
# Its public event record is ungated, starts 2026-08-03T21:00:00Z, and opens
# 15 minutes early. The media endpoint is not published while status is
# NOT_STARTED; surface and PCM-probe the master manifest during that window.
# Q4 metadata exposes only a speaker/internal phone intake, not public attendee
# dial-in access. This direct-m3u8 config remains a conditional NO-GO until a
# fresh master is written to $HOME/snap-stream.url and decodes on the run host.
#
# WEBCAST FANOUT ARM TEMPLATE — direct-m3u8 events (IR players, FOMC).
# The production armed posture from the 07-22 race findings (docs/RACE-STRATEGY.md §5):
#   leg 1 "streamlink"  — edge-join primary: the measured ladder winner
#                         (−11.7..−13.65 s vs default join, RUNBOOK 07-17 + 07-20)
#   leg 2 "pipe_tuned"  — tuned-ffmpeg backstop (-live_start_index -1 = the only
#                         flag that moves the join point; −10.6..−11.65 s vs default)
# Both legs run FULL detect chains OR-ed at the one-shot decision table
# ([arbiter] mode = "fanout") — different legs hear different audio (07-22 TARI).
#
# Instantiate per event with scripts/stage-webcast-arm.sh, then:
#   1. paste the `earshot prepare` keyword/risk sections over the placeholders,
#   2. on call morning write the m3u8:  echo "<m3u8>" > ~/<lc>-stream.url
#   3. launch attended: scripts/launch-webcast.sh --config <this> --account <env> \
#        --wait-live ~/<lc>-stream.url --wait-kind hls
# The live gate lives in launch-webcast.sh (NEVER inside a source cmd —
# 07-22 post-mortems #1/#2). YouTube events: do NOT use this template; keep
# the frozen yt-dlp leg (configs/webcast-tsla.toml) until a streamlink-vs-
# YouTube ladder number exists (capture first).
# Posture: mention-probe observe (1¢ non-crossing) — fill posture is gated on
# the Phase-4 precision verdict (docs/RACE-STRATEGY.md).

[event]
id        = "KXEARNINGSMENTIONSNAP-26AUG03-WEBCAST"
starts_at = "2026-08-03T21:00:00Z"

[pipeline]
chunk_ms       = 80
resample_to_hz = 16000

[detector]
engine = "streaming_ctc"

[detector.streaming_ctc]
model_dir         = "models/sherpa-onnx-streaming-zipformer-ctc-small-2024-03-18"
num_threads       = 1
default_threshold = 0.15
refractory_ms     = 2000

# sherpa_kws block kept so the engine reverts with a one-line change above.

[detector.sherpa_kws]
model_dir         = "models/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01"
num_threads       = 1
max_active_paths  = 4
default_threshold = 0.20
default_boost     = 2.0
refractory_ms     = 2000
fp32              = true

[arbiter]
mode = "fanout"

# LEG LADDER UPGRADED 2026-08-03 (pre-call). This event was staged on the base
# non-speculative template, but SNAP is a Q4 Inc → Amazon IVS venue — exactly the
# class spec_edge was tuned for (2 s segments, real PDT, #EXT-X-PREFETCH). AAPL
# 26JUL30 measured on this same class: spec_edge 12.50 s median lag / 0.91 s
# spread vs streamlink 17.18 s / 4.94 s ("the erratic joiner"). Running the base
# template here would have given away ~4.7 s and 5x the variance for no reason.
# Three legs, not two: this exact venue has never been captured by us, so
# streamlink is retained as a third fallback rather than replaced. [arbiter]
# mode="fanout" takes the earliest detection, so an extra leg costs CPU only.
# The repo-path test keeps this runnable on BOTH hosts — box ($HOME/ear) and
# laptop ($HOME/Code/ear) — because which host captures SNAP is decided by the
# session-bound-token probe, not in advance.
[[sources]]
kind = "pipe"
label = "spec_edge"
sample_rate_hz = 16000
cmd = [
  "/bin/sh", "-c",
  "python3 \"$([ -f $HOME/ear/scripts/hls-edge-fetch.py ] && echo $HOME/ear/scripts/hls-edge-fetch.py || echo $HOME/Code/ear/scripts/hls-edge-fetch.py)\" \"$(cat $HOME/snap-stream.url)\" 250 2 --speculative --prefetch --stream-body --prefetch-report --arrival-log $HOME/snap-arrival.log 2>>$HOME/snap_spec_edge.err | ffmpeg -loglevel warning -fflags +discardcorrupt+nobuffer -flags low_delay -probesize 200000 -analyzeduration 3000000 -i - -vn -f s16le -ac 1 -ar 16000 -",
]

[[sources]]
kind = "pipe"
label = "streamlink"
sample_rate_hz = 16000
cmd = [
  "/bin/sh", "-c",
  "streamlink --stdout --hls-live-edge 1 --hls-segment-stream-data --hls-playlist-reload-time segment \"$(cat $HOME/snap-stream.url)\" best | ffmpeg -loglevel warning -fflags nobuffer -flags low_delay -probesize 2000000 -analyzeduration 5000000 -i - -vn -f s16le -ac 1 -ar 16000 -",
]

[[sources]]
kind = "pipe"
label = "pipe_tuned"
sample_rate_hz = 16000
cmd = [
  "/bin/sh", "-c",
  "ffmpeg -loglevel warning -fflags nobuffer -flags low_delay -probesize 2000000 -analyzeduration 5000000 -live_start_index -1 -http_persistent 1 -reconnect 1 -reconnect_streamed 1 -reconnect_delay_max 2 -i \"$(cat $HOME/snap-stream.url)\" -vn -f s16le -ac 1 -ar 16000 -",
]

# NOTE (SUPERSEDED 2026-07-24 night — kept as the evidence trail): this file
# used to say the edge-fetcher leg delivers "+0 ms" and that "the gap is decode,
# not acquisition". BOTH clauses are now refuted (docs/LATENCY-PROOF.md parts
# 1-3): the AXP NFL race decomposed to 1.241 s FEED + 0.289 s OURS, so the gap
# is NOT decode; and the +0 ms reading came from an instrument that compared two
# ffmpeg legs to each other and was structurally blind to a cost they shared.
# Measured against the encoder instead, a speculative fetcher runs 4.5 s fresher
# than this template's legs with ~5x less run-to-run variance.
#
# THIS TEMPLATE IS DELIBERATELY UNCHANGED — it is the proven stack, and FOMC
# 2026-07-29 runs it. The speculative posture lives in
# configs/webcast-fanout-arm-spec.toml (staged with
# `stage-webcast-arm.sh --speculative`) and is gated on off-FOMC validation,
# because its probing could get the box's IP rate-limited and that would take
# every leg down, not just one.

[kalshi]
series = "KXEARNINGSMENTIONSNAP"
env = "prod"

