# M1 bake-off keyword config (docs/BAKEOFF.md). Used by bench-detector only —
# tickers are placeholders, nothing here touches Kalshi. Thresholds are the
# DEV-TUNING surface; the holdout runs whatever is frozen here at the time.
#
# Prefix → token cuts (from the full word's encoding, kws_compile):
#   reces   → ▁RE CE S        (of ▁RE CE S S ION)
#   guid    → ▁GU ID          (of ▁GU ID ANCE)
#   tari    → ▁TA RI          (of ▁TA RI FF)
#   acquis  → ▁A C QU IS      (of ▁A C QU IS ITION)
#   partner → ▁PART N ER      (of ▁PART N ER SHIP)

[event]
id        = "M1-BAKEOFF"
starts_at = "2026-07-30T21:00:00Z"

[pipeline]
chunk_ms       = 160
resample_to_hz = 16000

[detector]
engine = "sherpa_kws"

[detector.sherpa_kws]
model_dir         = "models/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01"
num_threads       = 1
max_active_paths  = 4
default_threshold = 0.20
default_boost     = 2.0
refractory_ms     = 2000

# Present so `bench-detector --engines streaming_ctc` can BUILD the detector
# without panicking: bench `run_cell` overrides only `detector.engine`, and
# `factory::build_detector` does `streaming_ctc.as_ref().expect(...)` — with no
# section that expect panics (src/bench/mod.rs, src/detector/factory.rs).
# validate() permits this section alongside sherpa_kws (engine stays sherpa_kws
# for the sherpa cells). ENGLISH model landed 2026-07-17 (Tier-0 hunt,
# docs/CTC-MODEL-SOURCING.md → csukuangfj streaming-zipformer-small
# 2024-03-18, trained --causal 1 --use-ctc 1 on full LibriSpeech; fetched by
# scripts/fetch-models.sh, sha in VERIFICATIONS.md). LibriSpeech BPE-500
# vocab; 320 ms decode quantum (out_per_chunk 8 vs the kws model's 640 ms).
# Threshold 0.15 is DEV-TUNED 2026-07-17 (0.5/0.35 identical; 0.15 recovers
# partnership 0.5→1.0 recall at zero FA cost; tariff threshold-insensitive —
# domain gap, see BAKEOFF.md streaming_ctc section). Holdout not yet run.
[detector.streaming_ctc]
model_dir         = "models/sherpa-onnx-streaming-zipformer-ctc-small-2024-03-18"
num_threads       = 1
default_threshold = 0.15

[[sources]]                      # unused by bench-detector (corpus supplies audio)
kind = "replay"
path = "unused.wav"

[kalshi]
series = "KXEARNINGSMENTION"

[[keywords]]
market_ticker    = "KX-BENCH-RECESSION"
phrase           = "recession"
variants         = ["recession", "recessions"]
max_price_cents  = 97
budget_contracts = 200
policy           = "two_tier"
# "reces" (▁RE CE S) collides with reception/session on telephony audio
# (dev FA autopsy) — "recess" adds the second S, killing those matches while
# still firing one token before the full word.
fast_prefixes    = ["recess"]
fast_threshold   = 0.20
confirmed_threshold = 0.28

[[keywords]]
market_ticker    = "KX-BENCH-GUIDANCE"
phrase           = "guidance"
variants         = ["guidance"]
max_price_cents  = 97
budget_contracts = 200
policy           = "two_tier"
# ▁GU ID also prefixes guiding/guided (said constantly on calls) and there
# is no token boundary between "guid" and "guidance" — prefix firing is
# structurally unavailable for this word (dev FA autopsy).
fast_prefixes    = []
confirmed_threshold = 0.25

[[keywords]]
market_ticker    = "KX-BENCH-TARIFF"
phrase           = "tariff"
variants         = ["tariff", "tariffs"]
max_price_cents  = 97
budget_contracts = 200
policy           = "two_tier"
fast_prefixes    = ["tari"]
fast_threshold   = 0.05
confirmed_threshold = 0.10
boost            = 3.0

[[keywords]]
market_ticker    = "KX-BENCH-ACQUISITION"
phrase           = "acquisition"
variants         = ["acquisition", "acquisitions"]
max_price_cents  = 97
budget_contracts = 200
policy           = "two_tier"
fast_prefixes    = ["acquis"]
fast_threshold   = 0.20
confirmed_threshold = 0.15

[[keywords]]
market_ticker    = "KX-BENCH-PARTNERSHIP"
phrase           = "partnership"
variants         = ["partnership", "partnerships"]
max_price_cents  = 97
budget_contracts = 200
policy           = "two_tier"
fast_prefixes    = []          # "partner" collides with the standalone word — no usable token boundary before SHIP
