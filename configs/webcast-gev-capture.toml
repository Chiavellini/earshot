# GEV Q2 2026 — WEBCAST STUDY CAPTURE ONLY (Wed 2026-07-22 11:30 UTC = 7:30 AM ET).
# Driven by `earshot capture-bakeoff`: no orders, no Kalshi creds needed.
# Same 4-leg ladder as the DPZ template (configs/webcast-dpz-capture.toml —
# see that file for the full flag rationale/evidence). Morning steps (box):
#   echo "<m3u8>" > ~/gev-stream.url
#   sed -i "s|__GEV_URL__|<m3u8>|" ~/ear/configs/webcast-gev-capture.toml
#   ~/ear/scripts/manifest-probe.sh "<m3u8>" | tee ~/gev-capture/manifest-probe.txt
#   ~/run-gev-capture.sh
# Legs 3-4 are ISOLATED EXPERIMENTS — never debug during the call.
# Leg 4 REQUIRES streamlink on the box.
# NOTE: this runs ALONGSIDE the (separate) GEV phone autorun; it must NOT
# touch that event's state dir — hence the -WEBCAST event id suffix.

[event]
id        = "KXEARNINGSMENTIONGEV-26JUL22-WEBCAST"
starts_at = "2026-07-22T11:30:00Z"

[pipeline]
chunk_ms = 80

[[sources]]
kind = "pipe"
sample_rate_hz = 16000
cmd = [
  "/bin/sh", "-c",
  "ffmpeg -loglevel warning -i \"$(cat $HOME/gev-stream.url)\" -vn -f s16le -ac 1 -ar 16000 -",
]

[[sources]]
kind = "hls"
url = "__GEV_URL__"

[[sources]]
kind = "pipe"
label = "pipe_tuned"
sample_rate_hz = 16000
cmd = [
  "/bin/sh", "-c",
  "ffmpeg -loglevel warning -fflags nobuffer -flags low_delay -probesize 1000000 -analyzeduration 2000000 -live_start_index -1 -http_persistent 1 -reconnect 1 -reconnect_streamed 1 -reconnect_delay_max 2 -i \"$(cat $HOME/gev-stream.url)\" -vn -f s16le -ac 1 -ar 16000 -",
]

[[sources]]
kind = "pipe"
label = "streamlink"
sample_rate_hz = 16000
cmd = [
  "/bin/sh", "-c",
  "streamlink --stdout --hls-live-edge 1 --hls-segment-stream-data --hls-playlist-reload-time segment \"$(cat $HOME/gev-stream.url)\" best | ffmpeg -loglevel warning -fflags nobuffer -flags low_delay -probesize 1000000 -analyzeduration 2000000 -i - -vn -f s16le -ac 1 -ar 16000 -",
]

[kalshi]
series = "KXEARNINGSMENTIONGEV"
env = "prod"

[[keywords]]
market_ticker   = "KXEARNINGSMENTIONGEV-26JUL22-CAPT"
phrase          = "electrification"
variants        = ["electrification"]
max_price_cents = 1
budget_contracts = 1
policy          = "confirmed_only"
