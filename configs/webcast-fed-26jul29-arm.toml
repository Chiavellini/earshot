# ── WEDNESDAY 2026-07-29 · FOMC / Kevin Warsh press conference · 2:30 PM ET ──
# Event: KXFEDMENTION-26JUL — "What will Kevin Warsh say during his July press
# conference". Ticker found 2026-07-26; it had never been pinned. 43 markets,
# nearly 3x Tuesday's.
#
# NON-SPECULATIVE legs, by STANDING DECISION. The speculative fetcher spends
# 404s to buy latency, and a rate-limit would take out EVERY leg on the box.
# This is the crown target; it runs the proven stack. Engine is streaming_ctc
# (D1d) — that is a separate axis from the fetch posture and the swap is
# adopted; revert with a one-line edit to `engine =`.
#
# VENUE: Brightcove / boltdns / Fastly, tokenized `fastly_token` (RUNBOOK FOMC
# recon). THREE THINGS ALREADY KNOWN ABOUT IT:
#   - the token is NOT IP-bound — a laptop-surfaced URL works from the box
#     (F1c: HTTP 200 from us-east), so surface on the laptop and hand it over;
#   - the fastest surfacing path is the Brightcove METRICS BEACON, whose
#     `media_url` query param carries the full tokenized master and which fires
#     on `video_impression`, ahead of the Playback-API and network-capture
#     routes;
#   - the archived June presser has 10 renditions, all ~10 s, no EXT-X-PART and
#     no SERVER-CONTROL, plus 3 audio-only renditions (worth only ~10 ms — the
#     fetch is round-trip bound, not bandwidth bound). Re-run variant-audit.py,
#     f2-probe.py and manifest-probe.sh DAY-OF; the live cadence may differ.
#
# ⚠⚠ THE FASTEST-RESOLVING MARKETS ON THIS BOARD ARE GREETINGS.
# `good afternoon` (KXFEDMENTION-26JUL-GOOD) and `good day` are near-certain in
# the FIRST SECONDS of the presser. They are decided PURELY by the race — not by
# detection quality, not by keyword risk.
#
# ── OPERATOR RULING 2026-07-27: NON-SPECULATIVE HOLDS, WITH ONE PRE-REGISTERED
#    DAY-OF OVERRIDE. ────────────────────────────────────────────────────────
#
# First, a correction to how this question was being framed. Campaign 2's whole
# measured FEED gain is `#EXT-X-PREFETCH`, which is an **Amazon IVS / Twitch**
# tag. **This venue is Brightcove/boltdns/Fastly, and the archived June presser
# carries no EXT-X-PART and no SERVER-CONTROL.** So prefetch is almost certainly
# NOT AVAILABLE here and is not the lever under discussion. The only lever this
# decision is about is `--speculative`, whose risk (spending 404s ⇒ rate-limit
# ⇒ every leg on the box dies) is what the standing decision was based on. That
# risk is unchanged by the discovery of a greeting market.
#
# The override condition is written BEFORE the probe runs, so it cannot be
# reverse-engineered from the number. **Arm `--speculative` on Wednesday ONLY IF
# ALL FOUR hold** in `scripts/manifest-probe.sh` output on the LIVE tokenized
# master:
#
#   1. `== speculative posture ==` reports **GO** — segment URLs numerically
#      predictable. (`pattern_is_predictable` needs 3 consecutive real segments;
#      if each segment carries its own token, this is a NO-GO by construction.)
#   2. Measured **`L` ≥ 1.00 s**. That is the LOWEST L ever measured at any
#      venue (+1.07 s Akamai/6 s; +1.40–1.51 s Unified/1.92 s) — i.e. "this
#      origin is at least as good as the worst one we know". Below that the
#      gain does not pay for the rate-limit exposure on the quarter's marquee
#      event.
#   3. Live segment cadence **≤ 10 s** (the VOD's `/10s/`). Longer and one
#      segment is far too long to be wrong about.
#   4. Launch is at least **60 s before the presser's first word**, so the
#      pattern check completes and speculation is actually ACTIVE for the
#      greeting. At 10 s segments the verification alone costs ~30 s. Joining
#      late means paying the risk and getting none of the benefit.
#
# ANY of the four failing ⇒ the legs below are used unchanged. Do not
# re-negotiate these after seeing the probe output.
#
# ── WHY NO `--prefetch-report` HERE, THOUGH IT IS FREE ELSEWHERE ────────────
# Both legs below are `streamlink` and direct `ffmpeg`; **neither runs
# `hls-edge-fetch.py`, so there is nowhere to put the flag.** Adding a fetcher
# leg to get recon would mean changing the proven stack on the crown target,
# which is not worth it. The same recon comes free from
# `scripts/manifest-probe.sh`, whose `== EXT-X-PREFETCH ==` section answers
# "does Brightcove ship any LHLS tag" at zero extra HTTP. **Run it day-of and
# pin the answer either way** — it is the first LHLS reading on a third venue
# class, and it informs every future FOMC-class event.
#
# ⚠ SHORT KEYWORDS — highest false-alarm risk in this set:
#   egg, oil, gas, tax, adp  (3 chars each, at the MIN_VARIANT_CHARS floor)
# and `trump` carries a HIGH-RISK collision flag (fires on "strong", 8 FAs
# measured). Preflight will list any 1-2 token targets; review before arming.
#
# ⚠ `event does not qualify` is a Kalshi housekeeping market, not a phrase Warsh
# will utter. Harmless (it will never fire) but it occupies a keyword slot.
#
# POSTURE: 1¢ non-crossing observe, no fill possible.
#
# WEBCAST FANOUT ARM TEMPLATE — direct-m3u8 events (IR players, FOMC).
# The production armed posture from the 07-22 race findings (docs/RACE-STRATEGY.md §5):
#   leg 1 "streamlink"  — edge-join primary: the measured ladder winner
#                         (−11.7..−13.65 s vs default join, RUNBOOK 07-17 + 07-20)
#   leg 2 "pipe_tuned"  — tuned-ffmpeg backstop (-live_start_index -1 = the only
#                         flag that moves the join point; −10.6..−11.65 s vs default)
# Both legs run FULL detect chains OR-ed at the one-shot decision table
# ([arbiter] mode = "fanout") — different legs hear different audio (07-22 TARI).
#
# Instantiate per event with scripts/stage-webcast-arm.sh, then:
#   1. paste the `earshot prepare` keyword/risk sections over the placeholders,
#   2. on call morning write the m3u8:  echo "<m3u8>" > ~/<lc>-stream.url
#   3. launch attended: scripts/launch-webcast.sh --config <this> --account <env> \
#        --wait-live ~/<lc>-stream.url --wait-kind hls
# The live gate lives in launch-webcast.sh (NEVER inside a source cmd —
# 07-22 post-mortems #1/#2). YouTube events: do NOT use this template; keep
# the frozen yt-dlp leg (configs/webcast-tsla.toml) until a streamlink-vs-
# YouTube ladder number exists (capture first).
# Posture: mention-probe observe (1¢ non-crossing) — fill posture is gated on
# the Phase-4 precision verdict (docs/RACE-STRATEGY.md).

[event]
id        = "KXFEDMENTION-26JUL"
starts_at = "2026-07-29T18:30:00Z"  # 2:30 PM ET = 18:30 UTC (EDT)

[pipeline]
chunk_ms       = 80
resample_to_hz = 16000

[detector]
engine = "streaming_ctc"

[detector.streaming_ctc]
model_dir         = "models/sherpa-onnx-streaming-zipformer-ctc-small-2024-03-18"
num_threads       = 1
default_threshold = 0.15
refractory_ms     = 2000

# kept so the engine reverts with a one-line edit to `engine =` above


[detector.sherpa_kws]
model_dir         = "models/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01"
num_threads       = 1
max_active_paths  = 4
default_threshold = 0.20
default_boost     = 2.0
refractory_ms     = 2000
fp32              = true

[arbiter]
mode = "fanout"

[[sources]]
kind = "pipe"
label = "streamlink"
sample_rate_hz = 16000
cmd = [
  "/bin/sh", "-c",
  "streamlink --stdout --hls-live-edge 1 --hls-segment-stream-data --hls-playlist-reload-time segment \"$(cat $HOME/fed-stream.url)\" best | ffmpeg -loglevel warning -fflags nobuffer -flags low_delay -probesize 2000000 -analyzeduration 5000000 -i - -vn -f s16le -ac 1 -ar 16000 -",
]

[[sources]]
kind = "pipe"
label = "pipe_tuned"
sample_rate_hz = 16000
cmd = [
  "/bin/sh", "-c",
  "ffmpeg -loglevel warning -fflags nobuffer -flags low_delay -probesize 2000000 -analyzeduration 5000000 -live_start_index -1 -http_persistent 1 -reconnect 1 -reconnect_streamed 1 -reconnect_delay_max 2 -i \"$(cat $HOME/fed-stream.url)\" -vn -f s16le -ac 1 -ar 16000 -",
]

