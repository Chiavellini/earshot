# PHONE-ONLY arm — derived from configs/webcast-cava-26aug11-arm-wc.toml by scripts/phone-lane-derive.py on 2026-08-11.
#
# Where a participant dial-in exists, the phone lane IS the lane: 26JUL29 CMG
# measured the phone 4.1-8.2 s AHEAD of the webcast on the SAME call, with one
# extra recall win. The webcast legs are therefore REMOVED, not kept as a
# backstop — a second leg costs CPU and buys false comfort.
#
# THE CONSEQUENCE: there is NO webcast fallback for this event. The phone leg is
# the only capture path, so "refuse when unsure" is the WRONG default here —
# declining to arm is zero coverage, which is worse than arming on partial
# evidence. Where the evidence supports it, arm under an explicit
# EARSHOT_GREEN_OVERRIDE="<reason>", which PAGES (scripts/launch-event.sh).
#
# Keywords are copied BYTE-FOR-BYTE from the twin except the posture numbers, so
# keywords_sha256 is unchanged and configs/.readiness/cava-26aug11-phone-arm.json plus its
# dead-word ack carry over (scripts/keywords-extract.py hashes ticker/phrase/
# variants only, never caps or thresholds).
#
# Execution host: the us-east-1 box. Ingress wss://media.3-212-174-94.sslip.io/e/8080
# (Caddy terminates TLS; /e/<port> must be routed in deploy/caddy/Caddyfile).
# Verify the host BEFORE event day:  scripts/box-ready.sh --config configs/cava-26aug11-phone-arm.toml
#
# Posture: MENTION-FILL — max_price_cents = 97 (ceiling MENTION_FILL_CAP_CENTS = 97), budget_contracts = 10.
# Orders MAY cross and fill. Launch needs --i-am-live --allow-mention --fillable
# (src/main.rs:1062-1067 refuses --fillable without both).
# min_confidence_confirmed = 0.22 — PROVENANCE: a single in-sample day
# (26AUG05 tape, n=26). NOT validated out of sample. Treat as a working
# default that has never been tested against a day it did not come from.


[event]
id        = "KXEARNINGSMENTIONCAVA-26AUG11-PHONE"
# Resolved 2026-08-11 from the Q4 attendee REST twin (public, no credential):
#   https://attendees.events.q4inc.com/rest/v1/event/411798645
#   -> data.eventStart = 2026-08-11T21:00:00.000Z, eventTz America/New_York,
#      title "CAVA Q2 2026 Earnings Call", status NOT_STARTED.
# Was the midnight-UTC placeholder, which stages every T-75 job ALREADY PAST
# (runs=0, silent total miss — the 08-06 slate lost all 5 events this way).
starts_at = "2026-08-11T21:00:00Z"

[pipeline]
chunk_ms       = 80
resample_to_hz = 16000

[detector]
engine = "streaming_ctc"

[detector.streaming_ctc]
model_dir         = "models/sherpa-onnx-streaming-zipformer-ctc-small-2024-03-18"
num_threads       = 1
default_threshold = 0.15
refractory_ms     = 2000

# sherpa_kws block kept so the engine reverts with a one-line change above.

[detector.sherpa_kws]
model_dir         = "models/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01"
num_threads       = 1
max_active_paths  = 4
default_threshold = 0.20
default_boost     = 2.0
refractory_ms     = 2000
fp32              = true

# NO [arbiter] section — deliberate. `fanout` requires >= 2 sources
# (src/config.rs:704) and this arm has exactly one, so the default single-source
# arbiter is correct. Adding [arbiter] here makes the config fail validation.

[[sources]]
# THE phone leg. max_reconnects/idle_timeout_secs are the Q-REDIAL production
# values; they require EARSHOT_REDIAL_DIR, which scripts/launch-event.sh exports
# (src/config.rs:588 refuses to arm otherwise). Without them a single mid-call
# drop ends the run, and preflight FAILs the config unless launched
# --one-shot-ok. Number + PIN are passed on the launcher command line and stay
# OUT of git.
kind = "twilio_stream"
bind = "127.0.0.1:8080"
max_reconnects = 2
idle_timeout_secs = 8

[operator_handler]
# Human-first admission for operator-screened bridges (docs/OPERATOR-HANDLER.md,
# Q-CONF 2026-07-30). Pages cell_number into a Twilio <Conference>, THEN dials
# the bridge into the same room with a <Start><Stream track="inbound_track"/>
# fork — the human's voice stays off the detector's track.
#
# Arming an operator_screened venue needs BOTH halves: enabled=true here AND
# operator_handler = "rehearsed-YYYY-MM-DD" for the venue in configs/dial-ins.toml
# (written only by a passed scripts/fake-operator rehearsal, never by hand).
enabled           = true
cell_number       = "+525545436717"
conference_prefix = "earshot"

[kalshi]
series = "KXEARNINGSMENTIONCAVA"
env = "prod"

# ── Placeholders below: replace with the `earshot prepare` output ──────────

[risk]
# TWO BANDS (2026-08-11 operator ruling): $10 for high-accuracy words, $1 for
# low-accuracy ones. Both bands cross at the SAME 97c per-contract ceiling; only
# the contract count differs, so the top order is 10 x 97c = 970c.
max_order_notional_cents = 970
# Worst case if EVERY word fires and fills, from
#   posture-from-study.py --size-tiers "1.0:10" --low-band-budget 1:
#   12 HIGH x10 (970c) = 11640c  +  5 LOW x1 (97c) = 485c  =  12125c ($121.25).
#
# The LOW band is REAL money now. It used to be max_price_cents = 1, which is
# NOT "a 1c bet" — nothing rests at 1c on a mention board, so those orders were
# non-crossing and took no position at all. Five words that previously could not
# trade now can.
#
# The old 100c cap admitted exactly ONE order per event against a 97c fill cap
# (MEASURED 26AUG06 CELH: 5 Confirmed detections, 1 filled, 2 refused on
# EventNotional) — the cap, not detection, was binding, and it failed SILENTLY
# as a refusal rather than loudly as a misconfiguration.
max_event_notional_cents = 12125
book_stale_ms            = 2000
audio_stale_ms           = 2000
