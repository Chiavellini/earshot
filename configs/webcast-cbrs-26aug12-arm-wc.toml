[risk]
# TWO BANDS (2026-08-11 operator ruling, low band re-set to $2 on 2026-08-12 for
# this event): $10 for high-accuracy words, $2 for low-accuracy ones. Both bands
# cross at the SAME 97c per-contract ceiling; only the contract count differs,
# so the top order is 10 x 97c = 970c.
max_order_notional_cents = 970
# Worst case if EVERY word fires and fills, from
#   posture-from-study.py --size-tiers "1.0:10" --low-band-budget 2:
#   10 HIGH x10 (970c) = 9700c  +  4 LOW x2 (194c) = 776c  =  10476c ($104.76).
# Fits under PROBE_LEDGER_CAP_CENTS = 13000 (src/risk.rs) with 2524c of headroom;
# this event's ledger (state/<E>/probe_ledger.json) starts at 0.
#
# The LOW band is REAL money. It used to be max_price_cents = 1, which is NOT
# "a 1c bet" — nothing rests at 1c on a mention board, so those orders were
# non-crossing and took no position at all. Four words that previously could not
# trade now can: amd 0.59, aws 0.56, openai 0.44, kimi 0.11.
#
# The old 100c cap admitted exactly ONE order per event against a 97c fill cap
# (MEASURED 26AUG06 CELH: 5 Confirmed detections, 1 filled, 2 refused on
# EventNotional) — the cap, not detection, was binding, and it failed SILENTLY
# as a refusal rather than loudly as a misconfiguration.
max_event_notional_cents = 10476
book_stale_ms            = 2000
audio_stale_ms           = 2000
