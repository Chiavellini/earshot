# WEBCAST-ONLY FANOUT ARM (G3, no bridge number found pre-call): two edge-join
# legs OR'd at the decision table. Call-morning: echo "<m3u8>" > ~/aal-stream.url
# then launch from a PLAIN shell:
#   scripts/launch-webcast.sh --config configs/webcast-aal-arm.toml \
#     --account <env> --bin <pinned> --wait-live ~/aal-stream.url --wait-kind hls
# If a bridge number lands, use configs/twilio-live-aal.toml + launch-event.sh
# (mixed-leg recipe: RUNBOOK runsheet item 3).

[arbiter]
mode = "fanout"

[[sources]]
kind = "pipe"
label = "streamlink"
sample_rate_hz = 16000
cmd = [
  "/bin/sh", "-c",
  "streamlink --stdout --hls-live-edge 1 --hls-segment-stream-data --hls-playlist-reload-time segment \"$(cat $HOME/aal-stream.url)\" best | ffmpeg -loglevel warning -fflags nobuffer -flags low_delay -probesize 1000000 -analyzeduration 2000000 -i - -vn -f s16le -ac 1 -ar 16000 -",
]

[[sources]]
kind = "pipe"
label = "pipe_tuned"
sample_rate_hz = 16000
cmd = [
  "/bin/sh", "-c",
  "ffmpeg -loglevel warning -fflags nobuffer -flags low_delay -probesize 1000000 -analyzeduration 2000000 -live_start_index -1 -http_persistent 1 -reconnect 1 -reconnect_streamed 1 -reconnect_delay_max 2 -i \"$(cat $HOME/aal-stream.url)\" -vn -f s16le -ac 1 -ar 16000 -",
]

