# EARSHOT dial-in access registry
#
# WHAT THIS IS: the durable, per-issuer answer to "can we dial a number and LISTEN
# to this earnings call in real time?" — which decides whether a KXEARNINGSMENTION<T>
# series is tradeable on the phone-first capture path at all.
#
# WHAT THIS IS NOT: a store of dial-in numbers or passcodes. Those rotate per call and
# stay OUT of the repo (docs/layers/prepare.md, src/prepare.rs) — they live in the
# gitignored per-event env files (configs/*-autorun.env). This file records the ACCESS
# PATTERN plus the URL where the current number is published; fetch the digits at
# prep time from `number_src`.
#
# ── FIELD SEMANTICS (read this before adding an entry) ────────────────────────────
#
# tier          how the LISTEN path is obtained:
#                 published          — number openly published, no registration. Dial it.
#                 bridge_unpublished — a real PSTN bridge provably exists, but no number
#                                      is published. Needs a number hunt (RUNBOOK Track A).
#                 none               — no phone leg exists at all. NOT phone-tradeable.
#                 unknown            — not yet researched. Never treat as none.
#
# qa_mechanism  how ANALYSTS get into the question queue. Diagnostic only:
#                 dtmf_star     — self-service "press star-N on your telephone" (or "*N")
#                 curated       — operator reads pre-arranged analysts by name, no DTMF
#                 hybrid        — phone bridge + webcast raise-hand
#                 phone_present — phone leg evidenced (handset language) but no queue
#                                 instruction quoted. Distinct from `unknown` (found
#                                 nothing) and from `dtmf_star` (would claim a mechanism
#                                 the text never showed).
#                 webcast_hand  — webcast platform raise-hand/unmute, no phone
#                 say_typed     — Say Technologies typed retail Q&A read aloud by
#                                 management; no dial-in queue exists (HOOD)
#                 unknown       — not researched / nothing found
#
#               Derive this with scripts/mine-dial-in.py, never by hand.
#               `scripts/mine-dial-in.py --check` pins 6 corpus verdicts + 8 synthetic
#               operator strings; it caught two real false negatives that review missed:
#               QCOM ("star THEN the number one") and GOOGL ("press *1" — the GLYPH,
#               on the largest near-term event).
#
# listen_access can WE dial in and listen?
#               "yes" | "no" | "operator_screened" | "unknown"
#               (string enum, never a bool — "unknown" must be representable)
#                 operator_screened — a number exists and answers, but a LIVE HUMAN
#                                     screens callers (asks name/company/conference)
#                                     and disconnects silent lines in <90 s. NOT
#                                     phone-automatable until the gated operator-
#                                     responder path ships (VERIFICATIONS Q-OPS,
#                                     Q-ADMIT). Set ONLY by a live dial, like
#                                     `admission` below.
#
# ⚠ THE APPLE RULE — the single most important invariant in this file:
#   `qa_mechanism` and `listen_access` are INDEPENDENT. A curated Q&A queue does NOT
#   imply the absence of a public listen line. AAPL proves it: zero star-1/keypad
#   language anywhere in its transcript, yet Apple publishes a dial-in on its IR page.
#   Inferring `listen_access=false` from "no DTMF in the transcript" is a real error
#   that was made and caught on 2026-07-16. A transcript can only ever establish
#   `qa_mechanism`. `listen_access` is established ONLY by an IR page / press release
#   / 8-K. Never mark an issuer `none` on transcript evidence alone.
#
# ⚠ THE MSFT RULE — the admission mirror of the APPLE RULE:
#   `admission` is established ONLY by a probe dial (scripts/bridge-probe.sh), NEVER
#   by an IR page / PR / 8-K / transcript. Paper sources can establish the NUMBER but
#   not what the bridge does to a silent listen-only caller. MSFT proves it: the PR
#   says "no password required", the registry said listen_access="yes", and the live
#   bridge is an INCOM operator screen that drops us in 42 s (2026-07-29, Q-ADMIT).
#
# admission        what the bridge did to our silent listen-only probe caller:
#                    held              — admitted and held (record duration in detail)
#                    dropped           — connected, then far end hung up on us
#                    operator_screened — live human asked who we are, then dropped us
#                    untested          — no probe yet. Preflight FAILs a phone arm on
#                                        anything but `held` (a `held` older than
#                                        30 days WARNs — re-probe, it's ~$0.02).
# admission_detail  free text: "held 76min", "dropped 42s after operator mute-check"
# admission_probed  date of the probe dial, "YYYY-MM-DD". Stale after 30 days.
# probe_artifact    recording + transcript path, corpus/bridge-probes/<label>.wav
#                   (gitignored; laptop/box-local — the transcript excerpt that matters
#                   gets pinned in VERIFICATIONS.md Q-ADMIT)
#
# reservation_window  true when the bridge EXISTS ONLY in its event window, so an
#                   off-hours probe cannot classify it (VERIFICATIONS Q-ADMIT
#                   addendum 2026-07-30). AAPL is the type specimen: rang 55 s,
#                   status=no-answer, ZERO media at 03:40 UTC, with numbers and
#                   code byte-identical in Wayback since 2024 — the bridge was
#                   not dead, it was not yet provisioned. For these venues a
#                   no-answer is NOT evidence, and admission="untested" means
#                   "not yet probeable" rather than "nobody bothered".
#                   scripts/preflight-event.sh downgrades the untested FAIL to a
#                   WARN naming the T-90..T-30 window and the exact command;
#                   scripts/admission-window-probe.sh is that command and
#                   REFUSES to dial outside the window.
#
# operator_handler  "rehearsed-YYYY-MM-DD" — set ONLY after a full fake-operator
#                   ladder rehearsal of the gated human-first handler
#                   (docs/OPERATOR-HANDLER.md v1, tests/twilio_operator_gated.rs).
#                   With this field present AND the event config carrying
#                   [operator_handler] enabled=true, preflight downgrades an
#                   admission="operator_screened" FAIL to PASS-with-note
#                   (scripts/preflight-event.sh). Never set it by hand without
#                   the rehearsal date it names.
#
# EVIDENCE ORDER (strongest first):
#   IR events page / earnings PR  →  8-K exhibit  →  official transcript operator preamble
#   Transcripts: Insider Monkey / Investing.com. ⛔ NEVER Motley Fool — it redacts operator
#   text to "[Operator Instructions]" and dropped the preamble entirely on INTC and GEV,
#   which manufactures FALSE `none` readings.
#
# ⚠ 8-K SILENCE IS NOT EVIDENCE OF ABSENCE. UAL's Q2 8-K says "a live, listen-only
#   webcast" — phrasing identical in kind to Tesla's — yet UAL's operator runs a live
#   phone Q&A. Same words, opposite meaning. Only a transcript settles it.
#
# Keys are the Kalshi series suffix (KXEARNINGSMENTION<KEY>), NOT always the ISO ticker:
# Citi is `C`. Verified live 2026-07-16: 379 "Mentions" series, 135 KXEARNINGSMENTION*.

# ══════════════════════════════════════════════════════════════════════════════════
# TIER: published — dial and listen, no registration
# ══════════════════════════════════════════════════════════════════════════════════

