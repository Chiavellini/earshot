# D1 cell C3 (2026-08-18): C1 with hotwords_score 3.0 and max_active_paths 8 — the biasing-strength knob.
# INTERLEAVED in one bench-detector invocation on the same 41-phrase webcast
# keyword set:
#   bench-detector --config configs/bakeoff-online-asr.toml \
#       --engines streaming_ctc,online_asr --chunk-ms 160 --split dev \
#       [--model-dir <online_asr dir A>,<dir B>]
# Identical keyword set / thresholds to bakeoff-webcast.toml; only the engine
# blocks differ. The streaming_ctc block is the ARMED production operating point
# (ctc-small-2024-03-18, default_threshold 0.15) so the incumbent cell is the
# real incumbent. Pre-registered bars: docs/BAKEOFF.md §D1.

[event]
id        = "WEBCAST-BAKEOFF"
starts_at = "2026-07-30T21:00:00Z"

[pipeline]
chunk_ms       = 160
resample_to_hz = 16000

[detector]
engine = "online_asr"

[detector.streaming_ctc]
model_dir         = "models/sherpa-onnx-streaming-zipformer-ctc-small-2024-03-18"
num_threads       = 1
default_threshold = 0.15
refractory_ms     = 2000

[detector.online_asr]
model_dir         = "models/sherpa-onnx-streaming-zipformer-en-2023-06-26"
model_type        = "auto"
precision         = "int8"
num_threads       = 1
decoding_method   = "modified_beam_search"
max_active_paths  = 8
hotwords          = true
hotwords_score    = 3.0
refractory_ms     = 2000

[[sources]]                      # unused by bench-detector (corpus supplies audio)
kind = "replay"
path = "unused.wav"

[kalshi]
series = "KXEARNINGSMENTION"

[[keywords]]
market_ticker    = "KX-BENCH-APPLE"
phrase           = "apple"
variants         = ["apple", "apples"]
max_price_cents  = 97
budget_contracts = 1
