[event]
id        = "KXEARNINGSMENTIONBA-26JUL21"   # ⚠ ticker says JUL21; the CALL is JUL 28
starts_at = "2026-07-28T14:30:00Z"          # 10:30 AM ET = 14:30 UTC (EDT)

[pipeline]
chunk_ms       = 80
resample_to_hz = 16000

[detector]
engine = "streaming_ctc"

[detector.streaming_ctc]
model_dir         = "models/sherpa-onnx-streaming-zipformer-ctc-small-2024-03-18"
num_threads       = 1
default_threshold = 0.15
refractory_ms     = 2000

# sherpa_kws block kept so the engine can be reverted with a one-line change to
# `engine =` above, without re-deriving thresholds under time pressure.
[detector.sherpa_kws]
model_dir         = "models/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01"
num_threads       = 1
max_active_paths  = 4
default_threshold = 0.20
default_boost     = 2.0
refractory_ms     = 2000

[arbiter]
mode = "fanout"

[[sources]]
kind = "pipe"
label = "spec_edge"
sample_rate_hz = 16000
cmd = [
  "/bin/sh", "-c",
  "python3 $HOME/ear/scripts/hls-edge-fetch.py \"$(cat $HOME/ba-stream.url)\" 250 2 --speculative --prefetch --stream-body --prefetch-report --arrival-log $HOME/ba-arrival.log 2>>$HOME/ba_spec_edge.err | ffmpeg -loglevel warning -fflags +discardcorrupt+nobuffer -flags low_delay -probesize 200000 -analyzeduration 3000000 -i - -vn -f s16le -ac 1 -ar 16000 -",
]

[[sources]]
kind = "pipe"
label = "pipe_tuned"
sample_rate_hz = 16000
cmd = [
  "/bin/sh", "-c",
  "ffmpeg -loglevel warning -fflags nobuffer -flags low_delay -probesize 65536 -analyzeduration 1000000 -live_start_index -1 -http_persistent 1 -reconnect 1 -reconnect_streamed 1 -reconnect_delay_max 2 -i \"$(cat $HOME/ba-stream.url)\" -vn -f s16le -ac 1 -ar 16000 -",
]

[kalshi]
series = "KXEARNINGSMENTIONBA"
env = "prod"

[risk]
max_order_notional_cents = 100
max_event_notional_cents = 100
book_stale_ms            = 2000
audio_stale_ms           = 2000
allowlist_tickers = [
  "KXEARNINGSMENTIONBA-26JUL21-AIRB",
  "KXEARNINGSMENTIONBA-26JUL21-ARTE",
  "KXEARNINGSMENTIONBA-26JUL21-CHIN",
  "KXEARNINGSMENTIONBA-26JUL21-DIVI",
