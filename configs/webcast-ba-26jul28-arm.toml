# produced 38 of Ford's 65 false alarms (`docs/BAKEOFF.md:812-817`) — and it
# dropped LOUDLY (two `tracing::warn`s + the footer line), which is the whole
# point of the 07-24 generator fix.
#
# ── PER-WORD RISK, from the MEASURED record — read before any fillable run ──
# Every word below is at `max_price_cents = 1` (non-crossing observe: hits the
# executor's LOST_RACE branch, never sends, never debits the $1 ledger). At that
# cap a risky word costs NOTHING and EARNS EVIDENCE, so nothing is dropped —
# dropping would forfeit the data. These notes exist so the promotion loop
# (`scripts/validate-from-log.py` → `prepare::tuned_library`) cannot silently
# promote a word we already know is bad.
#
#   space   ⚠⚠ BOTH high-FA and high-TP, the dangerous combination.
#           ⚠ AN EARLIER REVISION OF THIS NOTE SAID THE RISK IS "aeroSPACE".
#           **THAT IS WRONG** and the lexicon says so: an embedded compound
#           tokenizes WITHOUT the word-start marker —
#             AEROSPACE / HYPERSPACE / INTERSPACE → `... S P A CE`
#           while the keyword target is `▁SP A CE`. The first token differs, so
#           the spotter CANNOT fire on them. The `▁` marker already protects
#           against words that merely CONTAIN the keyword.
#           The real exposure is the opposite shape — words the keyword is a
#           token-PREFIX of, 22 of them in this model's lexicon:
#             SPACECRAFT SPACEPORT SPACEFORCE SPACEMAN SPACELINES SPACESUIT …
#           `▁SP A CE` completes before the compound head is emitted, so the
#           hit fires and only THEN does "craft" arrive. **"spacecraft" is
#           near-certain on a Boeing call** and is a closed compound that does
#           NOT settle under Q4 (VERIFICATIONS.md:188-200 — the `ultra`←
#           "ultramaritime" class, docs/BAKEOFF.md:789).
#           TP side: "Boeing Defense, SPACE & Security" is a business-unit name
#           said on every Boeing call, so SPAC very likely settles YES too.
#           THE REAL COST IS NOT THE CENT: a "spacecraft" false fire CONSUMES
#           THE ONE-SHOT (`src/decision.rs:74` — after Done every further
#           detection returns None forever), so the genuine standalone mention
#           can never fire and a winnable race is forfeited. This is the first
#           word in the program where a false alarm costs a WIN rather than a
#           loss, and it is the strongest single argument for the right-context
#           gate (plan B1) — which vetoes exactly this shape and nothing else.
#   iran    CONFIRMED live false fire TWICE, both settled NO: TSLA 07-22 (×2)
#           and LMT 07-23 (`docs/COMPETITOR-ANATOMY.md:473-499`).
#   china   7 FAs in Ford's pre-arm screen (`docs/BAKEOFF.md:855`) + a live
#           false fire on TSLA (CHIN settled NO).
#   oil     3 chars — the short-keyword class already flagged in the FOMC config
#           (egg/oil/gas/tax/adp). Also a MS-run suspected false alarm still
#           open for transcript check (`COMPETITOR-ANATOMY.md` open items #1).
#   moon    4 chars, single syllable, entirely unscreened.
#   spaces / oils / moons / irans / chinas / nasas / starliners are GENERATED
#           plurals. Most are harmless non-words, but "spaces" is real and
#           common ("office spaces") — and a plural DOES count under Q4, so it
#           is rule-legal but adds FA surface. Watch it with `space`.
#   nasa, dividend  corpus-VALIDATED 1/1 each on the LMT call
#           (`docs/LATENCY-PROOF.md:1003-1011`). The two safest words here.
#   airbus, artemis, philippine airlines, starliner, wide body
#           long and distinctive — the `foundry` 11/0 / `braintree` class.
#
# ── ⚠ `tariff`: the sherpa-scale threshold was REMOVED. Do not re-add. ──────
# `prepare` emitted `confirmed_threshold = 0.1` + `boost = 3.0` for tariff (it
# is one of the 4 words in `prepare::tuned_library`, src/prepare.rs:93-101,
# emitted at :391-394). Those are **sherpa_kws-scale** values and this config
# runs `streaming_ctc`. Two independent faults:
#   - `boost` is SILENTLY DISCARDED (`streaming_ctc.rs:273` passes 1.0);
#   - `0.1` would be reinterpreted on the CTC geometric-mean-posterior scale,
#     where this config's default is 0.15 — i.e. tariff would run ~33 % looser
#     than every other word, on a scale it was never calibrated for.
# The identical bug was found and fixed in configs/webcast-f-26jul28-arm.toml
# the same night. `tariff` here runs on the config default like everything else.
#
# ── ⚠ HARD REQUIREMENT: ORT_DYLIB_PATH ────────────────────────────────────
# streaming_ctc dlopens onnxruntime. Unset under launchd's minimal env ⇒ the
# detector fails to build and the arm dies at startup. The launcher MUST export:
#   export ORT_DYLIB_PATH="$HOME/ear/$(cd $HOME/ear && find vendor -name 'libonnxruntime*.so*' | head -1)"
# Verify with a dry-run that reaches "source finished", not "streaming_ctc: ...".
