# WEBCAST LANE (same-floor event: TSLA has NO phone leg — registry tier
# `none`). Observe caps only; launched attended via scripts/launch-webcast.sh.
# The yt-dlp invocation is the smoke-tested 2026-07-17 command — three
# YouTube-2026 gotchas are load-bearing:
#   1. yt-dlp MUST be current (an Oct-2025 build is already rejected by
#      YouTube's anti-bot); ~/Library/Python/3.14/bin/yt-dlp on the CDMX box.
#   2. --js-runtimes node (YouTube extraction needs a JS runtime since 2026).
#   3. Live streams expose NO audio-only format → worst*[acodec!=none] picks
#      the smallest muxed rendition; ffmpeg -vn discards the video.
# ⚠ Set the real watch URL on call day: @Tesla/live should resolve once the
# stream is up; verify ~30 min early and check for a faster simulcast
# (company player / X) — the fastest public feed is the true floor.
[[sources]]
kind = "pipe"
sample_rate_hz = 16000
cmd = [
  "/bin/sh", "-c",
  "$HOME/Library/Python/3.14/bin/yt-dlp -q --js-runtimes node -f 'worst*[acodec!=none]' -o - 'https://www.youtube.com/@Tesla/live' | ffmpeg -loglevel warning -i - -vn -f s16le -ac 1 -ar 16000 -",
]

