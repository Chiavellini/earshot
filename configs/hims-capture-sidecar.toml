# HIMS 26AUG10 — AUDIO SIDE-CAR (recording only, runs ALONGSIDE the live arm).
#
# WHY: `earshot arm` records no audio and no transcript — `Command::Arm` has no
# --record flag, and streaming_ctc only scores CTC posteriors against the
# pre-compiled token sequences of the configured keywords, so there is no
# "what was said" anywhere in a normal run. Without audio there is no ground
# truth, and PRECISION (the thing actually gating larger size) stays
# unmeasurable. This config exists to bank the call audio so the run can be
# transcribed offline and every detection scored true/false after the fact.
#
# SAFETY: driven by `earshot capture-bakeoff` — no detector, no risk gate, no
# Kalshi connection, so it cannot place, cancel or influence an order. CLAUDE.md's
# "never point a recorder at a tradeable call" rule is about recording INSTEAD of
# arming (bridge-probe/chain-capture, which refuse against an open board); here
# we are arming, and this only adds a recording.
#
# ONE LEG ON PURPOSE. The 4-leg study template (configs/webcast-gev-capture.toml)
# would add four more streams to a box already running the arm's two legs, three
# sweep arms and a book-tape recorder — and CPU starvation, not the network, is
# the documented way a live arm loses audio frames. This leg is a byte-for-byte
# copy of the arm's `pipe_tuned` leg so the banked audio represents what the
# detector actually heard.
#
# The URL file is written by the q4resolve timer at go-live; scripts/capture-
# sidecar.sh waits for it before starting, exactly as arm-on-url.sh does.

[event]
id        = "KXEARNINGSMENTIONHIMS-26AUG10-CAPTURE"
starts_at = "2026-08-10T21:00:00Z"

[pipeline]
chunk_ms = 80

[[sources]]
kind = "pipe"
label = "sidecar"
sample_rate_hz = 16000
cmd = [
  "/bin/sh", "-c",
  "ffmpeg -loglevel warning -fflags nobuffer -flags low_delay -probesize 2000000 -analyzeduration 5000000 -live_start_index -1 -http_persistent 1 -reconnect 1 -reconnect_streamed 1 -reconnect_delay_max 2 -i \"$(cat $HOME/hims-stream.url)\" -vn -f s16le -ac 1 -ar 16000 -",
]

# [kalshi] and one [[keywords]] block are REQUIRED by the config schema even
# though capture-bakeoff builds no detector and opens no Kalshi connection —
# the parser refuses the file without them ("missing field `kalshi`"), which is
# how the gev/dpz capture templates are shaped too. Caught by a smoke test
# before the call rather than at go-live, where it would have cost the audio.
#
# The keyword below is INERT BY CONSTRUCTION: capture-bakeoff has no executor,
# and the ticker deliberately names a -CAPT market that does not exist on the
# board, so no real market can be referenced even in principle. Cap 1¢ as
# belt-and-braces.
[kalshi]
series = "KXEARNINGSMENTIONHIMS"
env = "prod"

[[keywords]]
market_ticker    = "KXEARNINGSMENTIONHIMS-26AUG10-CAPT"
phrase           = "placeholder"
variants         = ["placeholder"]
max_price_cents  = 1
budget_contracts = 1
policy           = "confirmed_only"
