# Autonomous / Automation (KXEARNINGSMENTIONTGT-26AUG19-AUTO) — corpus-UNVALIDATED (engine defaults) — best-effort recall; cap: probe (non-crossing, no fill) ; ⚠ compound/symbol phrase — review variants
# Fill-path verifier — SHADOW (detection-accuracy program D2, 2026-08-19).
# Records a second-opinion verdict for EVERY Confirmed detection (offline
# Parakeet-TDT-0.6b re-decode of the last 3.5 s of the firing leg) into
# report.json["verifier"]; gates NOTHING. If the model dir is missing on the
# host, shadow mode warns and the arm runs without it. Flip to mode = "gate" +
# tickers = [<generic fill words>] only after >= 3 shadow events
# (docs/BAKEOFF.md §D2, docs/nodes/verifier.md).
[verifier]
mode        = "shadow"
model_dir   = "models/sherpa-onnx-nemo-parakeet-tdt-0.6b-v2-int8"
model_type  = "nemo_transducer"
num_threads = 2
tail_ms     = 3500
budget_ms   = 500
on_timeout  = "send"
sample      = "all_confirmed"
tickers     = []

[[keywords]]
market_ticker    = "KXEARNINGSMENTIONTGT-26AUG19-AUTO"
phrase           = "autonomous"
variants         = ["autonomous", "automation", "automations"]
max_price_cents  = 1
budget_contracts = 1
policy           = "confirmed_only"

