# Twilio loopback rehearsal — LOG-ONLY, NO TRADING.
#
# Run with `earshot replay` (NOT `arm`): replay builds source + detector +
# decision table and runs the pipeline with intent_tx = None, so it connects
# to NOTHING on Kalshi, places no orders, and spends no money. It only prints
# the latency table + logs detections. This mirrors the Tuesday detector/source
# path (sherpa_kws + twilio_stream) so the rehearsal exercises the real thing.
#
#   ngrok http 8080                         # note the wss host
#   export TWILIO_STREAM_URL=wss://<host>/media   # in ~/.twilio/earshot_env
#   cargo run --release -- replay --config configs/twilio-loopback.toml
#   scripts/twilio-dial.sh --to +525545436717 --stream-url wss://<host>/media
#   → answer your phone, speak "tariff" / "recession" / "inflation"
#
# The market_tickers below are inert placeholders (replay never touches Kalshi).

[event]
id        = "TWILIO-LOOPBACK-REHEARSAL"
starts_at = "2026-07-13T00:00:00Z"

[pipeline]
chunk_ms       = 160
resample_to_hz = 16000            # sherpa_kws is 16 kHz; 8 kHz telephony upsampled

[detector]
engine = "sherpa_kws"

[detector.sherpa_kws]
model_dir         = "models/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01"
num_threads       = 1
max_active_paths  = 4
default_threshold = 0.20
default_boost     = 2.0
refractory_ms     = 2000

[[sources]]
kind = "twilio_stream"
bind = "127.0.0.1:8080"           # ngrok fronts this; Twilio connects wss://

[kalshi]
series = "KXEARNINGSMENTIONJPM"    # unused by replay (no executor/validator)

# Same tuning as configs/twilio-live.toml so the rehearsal reflects Tuesday's
# detector behavior. Tickers are placeholders — replay logs, never trades.
[[keywords]]
market_ticker       = "LOOPBACK-TARI"
phrase              = "tariff"
variants            = ["tariff", "tariffs"]
max_price_cents     = 1
budget_contracts    = 1
policy              = "confirmed_only"
confirmed_threshold = 0.10
boost               = 3.0

[[keywords]]
market_ticker       = "LOOPBACK-RECE"
phrase              = "recession"
variants            = ["recession", "recessions"]
max_price_cents     = 1
budget_contracts    = 1
policy              = "confirmed_only"
confirmed_threshold = 0.28

[[keywords]]
market_ticker       = "LOOPBACK-INFL"
phrase              = "inflation"
variants            = ["inflation"]
max_price_cents     = 1
budget_contracts    = 1
policy              = "confirmed_only"
