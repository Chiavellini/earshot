# PALANTIR Q2 2026 — official public venue is YouTube Live, not direct HLS:
#   https://www.youtube.com/live/yTHNjVWnoWo
# Verified from Palantir's own /events.html listing on 2026-08-03. Keep the
# YouTube acquisition pattern frozen to the previously exercised TSLA/HOOD
# path: yt-dlp owns segment fetching and ffmpeg only demuxes/resamples.
#
# Before an attended launch, write that official watch URL to
# $HOME/pltr-stream.url and run scripts/venue-probe.sh against it once the
# broadcast is actually live. A pre-live yt-dlp resolution from the CDMX
# laptop returned HTTP 429 before correctly reporting the scheduled event;
# therefore decodable audio is NOT yet proven and this config is not a GO
# until the live PCM gate passes. Both sources are independent full detect
# chains OR-ed at the one-shot decision table.
# Posture: mention-probe observe (1¢ non-crossing) — fill posture is gated on
# the Phase-4 precision verdict (docs/RACE-STRATEGY.md).

[event]
id        = "KXEARNINGSMENTIONPLTR-26AUG03-WEBCAST"
starts_at = "2026-08-03T21:00:00Z"

[pipeline]
chunk_ms       = 80
resample_to_hz = 16000

[detector]
engine = "streaming_ctc"

[detector.streaming_ctc]
model_dir         = "models/sherpa-onnx-streaming-zipformer-ctc-small-2024-03-18"
num_threads       = 1
default_threshold = 0.15
refractory_ms     = 2000

# sherpa_kws block kept so the engine reverts with a one-line change above.

[detector.sherpa_kws]
model_dir         = "models/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01"
num_threads       = 1
max_active_paths  = 4
default_threshold = 0.20
default_boost     = 2.0
refractory_ms     = 2000
fp32              = true

[arbiter]
mode = "fanout"

# ADDED 2026-08-03 21:02Z, LIVE, after measuring both paths against the resolved
# master manifest. youtube-resolve.sh writes an HLS MASTER, and ffmpeg speaks
# that directly — measured 190928/192000 bytes (99.4%) in a 6 s pcm-gate. The
# yt-dlp legs below feed the SAME manifest through yt-dlp's generic extractor
# and measured only 89132/160000 (56%) over 5 s: the pipe works, but yt-dlp's
# spin-up plus probesize costs seconds at the join. The premise for routing
# YouTube through yt-dlp was segment ADDRESSING on a watch page — irrelevant
# once we already hold the master manifest. Kept the yt-dlp legs as backstops
# (fanout takes the earliest detection) rather than swapping them out blind.
[[sources]]
kind = "pipe"
label = "ffmpeg_direct"
sample_rate_hz = 16000
cmd = [
  "/bin/sh", "-c",
  "ffmpeg -loglevel warning -fflags nobuffer -flags low_delay -probesize 200000 -analyzeduration 2000000 -live_start_index -1 -http_persistent 1 -reconnect 1 -reconnect_streamed 1 -reconnect_delay_max 2 -i \"$(cat $HOME/pltr-stream.url)\" -vn -f s16le -ac 1 -ar 16000 -",
]

[[sources]]
kind = "pipe"
label = "ytdlp_primary"
sample_rate_hz = 16000
cmd = [
  "/bin/sh", "-c",
  "/opt/homebrew/bin/yt-dlp -q --js-runtimes node -f 'worst*[acodec!=none]' -o - \"$(cat $HOME/pltr-stream.url)\" 2>>$HOME/pltr_ytdlp.err | ffmpeg -loglevel warning -fflags nobuffer -flags low_delay -probesize 1000000 -analyzeduration 2000000 -i - -vn -f s16le -ac 1 -ar 16000 -",
]

[[sources]]
kind = "pipe"
label = "ytdlp_backstop"
sample_rate_hz = 16000
cmd = [
  "/bin/sh", "-c",
  "/opt/homebrew/bin/yt-dlp -q --js-runtimes node -f 'worst*[acodec!=none]' -o - \"$(cat $HOME/pltr-stream.url)\" 2>>$HOME/pltr_ytdlp2.err | ffmpeg -loglevel warning -fflags +discardcorrupt+nobuffer -flags low_delay -probesize 1000000 -analyzeduration 2000000 -i - -vn -f s16le -ac 1 -ar 16000 -",
]

[kalshi]
series = "KXEARNINGSMENTIONPLTR"
env = "prod"

