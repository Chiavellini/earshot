# GRAB Q2 2026 — ACOUSTIC lane (Zoom web client -> laptop speakers -> laptop mic).
# MEASUREMENT ONLY. Run DRY-RUN (no --i-am-live): this audio path has never been
# validated against the detector, so it must not price real orders. What it buys
# is the first Zoom-class capture this repo has ever taken, with detection
# timestamps that can be scored against the Kalshi tape after settlement.
#
# Why this exists: Grab's only listen path is a Zoom webinar. There is no HLS
# (web client is WebRTC; @Grab is not live on YouTube) and the PSTN legs are
# gated on a numeric passcode that Zoom does not publish to non-registrants
# (see configs/dial-ins.toml [GRAB].admission = "passcode_required").
#
# Known degradations vs a telephony leg, all UNMEASURED as of 2026-08-03:
#   - speaker->mic acoustic path adds room reverb and clipping
#   - macOS output volume is part of the signal chain (set to 55 at start)
#   - any other sound on this machine contaminates the tape
# Keyword set is byte-identical to the validated one
# (sha256 dccf5151f7805f0e1451078af603aafc022a31349dbb56a792bb244f2b611386).

[event]
id        = "KXEARNINGSMENTIONGRAB-26AUG03-ACOUSTIC"
starts_at = "2026-08-04T00:00:00Z"

[pipeline]
chunk_ms       = 80
resample_to_hz = 16000

[detector]
engine = "streaming_ctc"

[detector.streaming_ctc]
model_dir         = "models/sherpa-onnx-streaming-zipformer-ctc-small-2024-03-18"
num_threads       = 1
default_threshold = 0.15
refractory_ms     = 2000

# sherpa_kws block kept so the engine reverts with a one-line change above.

[detector.sherpa_kws]
model_dir         = "models/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01"
num_threads       = 1
max_active_paths  = 4
default_threshold = 0.20
default_boost     = 2.0
refractory_ms     = 2000
fp32              = true

# One telephony leg, so there is nothing to arbitrate: "failover" is the
# default and degenerates to pass-through on a single source. NOT "fanout" —
# config.rs:676 rejects fanout with < 2 sources.
[arbiter]
mode = "failover"

[[sources]]
kind = "pipe"
label = "mic_acoustic"
sample_rate_hz = 16000
cmd = [
  "/bin/sh", "-c",
  "ffmpeg -hide_banner -loglevel error -f avfoundation -i ':0' -vn -f s16le -ac 1 -ar 16000 - | tee state/KXEARNINGSMENTIONGRAB-26AUG03-ACOUSTIC/mic.raw",
]

# NOTE (SUPERSEDED 2026-07-24 night — kept as the evidence trail): this file
# used to say the edge-fetcher leg delivers "+0 ms" and that "the gap is decode,
# not acquisition". BOTH clauses are now refuted (docs/LATENCY-PROOF.md parts
# 1-3): the AXP NFL race decomposed to 1.241 s FEED + 0.289 s OURS, so the gap
# is NOT decode; and the +0 ms reading came from an instrument that compared two
# ffmpeg legs to each other and was structurally blind to a cost they shared.
# Measured against the encoder instead, a speculative fetcher runs 4.5 s fresher
# than this template's legs with ~5x less run-to-run variance.
#
# THIS TEMPLATE IS DELIBERATELY UNCHANGED — it is the proven stack, and FOMC
# 2026-07-29 runs it. The speculative posture lives in
# configs/webcast-fanout-arm-spec.toml (staged with
# `stage-webcast-arm.sh --speculative`) and is gated on off-FOMC validation,
# because its probing could get the box's IP rate-limited and that would take
# every leg down, not just one.

[kalshi]
series = "KXEARNINGSMENTIONGRAB"
env = "prod"

# ── Placeholders below: replace with the `earshot prepare` output ──────────
[risk]
max_order_notional_cents = 100
max_event_notional_cents = 100
