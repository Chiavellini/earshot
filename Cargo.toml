[package]
name = "earshot"
version = "0.1.0"
edition = "2021"
description = "Audio-signal latency trader for Kalshi mention markets (M0 skeleton)"
publish = false

[dependencies]
arc-swap = "1"
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
hdrhistogram = "7"
hound = "3"
libc = "0.2"
reqwest = { version = "0.12", features = ["json", "blocking"] }
rsa = { version = "0.9", features = ["sha2"] }
rtrb = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sherpa-onnx = "1.13.4"
smallvec = { version = "1", features = ["serde"] }
thiserror = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "macros", "sync", "net", "signal"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

[profile.release]
lto = "thin"
codegen-units = 1
