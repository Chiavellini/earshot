[package]
name = "earshot"
version = "0.1.0"
edition = "2021"
description = "Audio-signal latency trader for Kalshi mention markets (M0 skeleton)"
publish = false

[dependencies]
arc-swap = "1"
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
hdrhistogram = "7"
http = "1"
hmac = "0.12"
hound = "3"
sha1 = "0.10"
kaldi-native-fbank = "0.1"
libc = "0.2"
ndarray = "0.16"
# load-dynamic: ort dlopens its own onnxruntime (1.27) at runtime via
# ORT_DYLIB_PATH, so it does NOT statically link onnxruntime — avoiding a symbol
# clash with sherpa-onnx's bundled static onnxruntime 1.24.2 (they can't share:
# ort needs API 27). See docs/layers/streaming_ctc.md.
ort = { version = "2.0.0-rc.12", features = ["ndarray", "load-dynamic"] }
reqwest = { version = "0.12", features = ["json", "blocking", "http2"] }
rsa = { version = "0.9", features = ["sha2"] }
rtrb = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sherpa-onnx = "1.13.4"
smallvec = { version = "1", features = ["serde"] }
thiserror = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "macros", "sync", "net", "signal", "process", "io-util"] }
tokio-native-tls = "0.3"
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

[dev-dependencies]
criterion = "0.5"
tempfile = "3"
wiremock = "0.6"

[[bench]]
name = "hot_path"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
